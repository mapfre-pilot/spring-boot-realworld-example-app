    <rect x="310" y="770" width="250" height="130" rx="10" fill="#d9f2dd" stroke="#2e7d32"/>
    <text x="435" y="805" font-size="30" font-weight="700" fill="#2e7d32">13</text><text x="435" y="835" fill="#1b3d1f">servicios del host</text><text x="435" y="855" fill="#1b3d1f">ofrecidos por el BFF</text>
    <rect x="580" y="770" width="250" height="130" rx="10" fill="#d9f2dd" stroke="#2e7d32"/>
    <text x="705" y="805" font-size="30" font-weight="700" fill="#2e7d32">41</text><text x="705" y="835" fill="#1b3d1f">pruebas automáticas</text><text x="705" y="855" fill="#1b3d1f">en verde (19 BFF + 22 SPA)</text>
    <rect x="850" y="770" width="250" height="130" rx="10" fill="#d9f2dd" stroke="#2e7d32"/>
    <text x="975" y="805" font-size="30" font-weight="700" fill="#2e7d32">12</text><text x="975" y="835" fill="#1b3d1f">rutas revisadas</text><text x="975" y="855" fill="#1b3d1f">en el navegador, sin errores</text>
    <rect x="1120" y="770" width="240" height="130" rx="10" fill="#fff4d6" stroke="#c98a00"/>
    <text x="1240" y="805" font-size="22" font-weight="700" fill="#6b4a00">Datos de ejemplo</text><text x="1240" y="835" fill="#6b4a00">funciona en modo local;</text><text x="1240" y="855" fill="#6b4a00">falta conexión al host</text>
