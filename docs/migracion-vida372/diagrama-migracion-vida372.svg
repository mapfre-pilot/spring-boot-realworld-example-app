  </defs>
  <rect width="1400" height="940" fill="#ffffff"/>
  <text x="40" y="48" font-size="28" font-weight="700" fill="#b30000">Migración ES_VIDA_372 Vencimientos Manuales</text>
  <text x="40" y="78" font-size="16" fill="#444">Fase 1: del framework Vida (Struts/WebSphere) a la arquitectura de referencia MAPFRE con el harness KDD</text>

  <!-- Leyenda -->
  <g font-size="14" fill="#333">
    <rect x="980" y="30" width="22" height="16" rx="3" fill="#d9f2dd" stroke="#2e7d32"/><text x="1010" y="43">Hecho</text>
    <rect x="1080" y="30" width="22" height="16" rx="3" fill="#fff4d6" stroke="#c98a00"/><text x="1110" y="43">Pendiente</text>
    <rect x="1210" y="30" width="22" height="16" rx="3" fill="#e8ecf4" stroke="#5a6b8c"/><text x="1240" y="43">Se mantiene</text>
  </g>

  <!-- Pasos realizados -->
  <text x="40" y="128" font-size="19" font-weight="700" fill="#222">1. Pasos realizados</text>
  <g font-size="14" fill="#1b3d1f" text-anchor="middle">
    <rect x="40" y="145" width="200" height="90" rx="10" fill="#d9f2dd" stroke="#2e7d32" stroke-width="1.5"/>
