ciones HTTP · 30 sistemas conectados (+3 CMP compartidos)</text><text x="965.0" y="338" text-anchor="middle" font-size="11" fill="#333">REST/JSON con OAuth2 API GW · token BFF · API key loopback · SOAP ESB/webMethods sin auth</text><text x="965.0" y="353" text-anchor="middle" font-size="11" fill="#333">73 integraciones y 7 sistemas conectados sin uso detectable</text><rect x="90" y="470" width="240" height="100" rx="8" fill="#f1f1f1" stroke="#666" stroke-width="1.5"/><text x="210.0" y="490" text-anchor="middle" font-weight="bold" font-size="13">API Clientes legacy</text><text x="210.0" y="508" text-anchor="middle" font-size="11" fill="#333">mrcconsultaback · api_negocioclientes</text><text x="210.0" y="523" text-anchor="middle" font-size="11" fill="#333">apisb…/clients/1.0 · Denodo</text><text x="210.0" y="538" text-anchor="middle" font-size="11" fill="#333">~70 integraciones</text><line x1="210" y1="390" x2="210" y2="470" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><rect x="340" y="470" width="240" height="100" rx="8" fill="#f1f1f1" stroke="#666" stroke-width="1.5"/><text x="460.0" y="490" text-anchor="middle" font-weight="bold" font-size="13">Pólizas por ramo</text><text x="460.0" y="508" text-anchor="middle" font-size="11" fill="#333">Health API · Life Risk API</text><text x="460.0" y="523" text-anchor="middle" font-size="11" fill="#333">Home API · Motor API</text><text x="460.0" y="538" text-anchor="middle" font-size="11" fill="#333">ServiciosHogar (SOAP)</text><line x1="460" y1="390" x2="460" y2="470" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><rect x="590" y="470" width="240" height="100" rx="8" fill="#f1f1f1" stroke="#666" stroke-width="1.5"/><text x="710.0" y="490" text-anchor="middle" font-weight="bold" font-size="13">Recibos / Siniestros</text><text x="710.0" y="508" text-anchor="middle" font-size="11" fill="#333">gesycore · GESYC ESB (SOAP)</text><text x="710.0" y="523" text-anchor="middle" font-size="11" fill="#333">METS autos · ATN ESB</text><text x="710.0" y="538" text-anchor="middle" font-size="11" fill="#333">Exstream</text><line x1="710" y1="390" x2="710" y2="470" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><rect x="840" y="470" width="240" height="100" rx="8" fill="#f1f1f1" stroke="#666" stroke-width="1.5"/><text x="960.0" y="490" text-anchor="middle" font-weight="bold" font-size="13">Comercial</text><text x="960.0" y="508" text-anchor="middle" font-size="11" fill="#333">PGO /apipgo (19) · SGC 3.0 (17)</text><text x="960.0" y="523" text-anchor="middle" font-size="11" fill="#333">iMediador EDGE (12) · BDEC</text><text x="960.0" y="538" text-anchor="middle" font-size="11" fill="#333">ESTRUAGE · Portal Interno</text><line x1="960" y1="390" x2="960" y2="470" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><rect x="1090" y="470" width="240" height="100" rx="8" fill="#f1f1f1" stroke="#666" stroke-width="1.5"/><text x="1210.0" y="490" text-anchor="middle" font-weight="bold" font-size="13">Otros / terceros</text><text x="1210.0" y="508" text-anchor="middle" font-size="11" fill="#333">SGO webMethods · WLCatalog ESB</text><text x="1210.0" y="523" text-anchor="middle" font-size="11" fill="#333">Citrix lambda · NSE · Verti · Santander</text><text x="1210.0" y="538" text-anchor="middle" font-size="11" fill="#333">SAVIA · ACI · Club · ConectaOrange · BFF /api-pgm</text><line x1="1210" y1="390" x2="1210" y2="470" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="700.0" y="620" text-anchor="middle" font-size="13" fill="#333">Patrón dominante: la pantalla (o un proceso) llama directamente a cada sistema; la agregación de la visión 360 se hace en Appian (PGM_CompletarInfoCliente: 8 integraciones en paralelo).</text><text x="700.0" y="642" text-anchor="middle" font-size="13" fill="#c8102e">Acoplamiento directo canal → legacy en ≥ 12 dominios técnicos · caché de PII propia · URLs de PRE/DESA hardcoded · versionado por duplicación</text><rect x="90" y="680" width="1240" height="100" rx="8" fill="#fff" stroke="#999" stroke-width="1.5"/><text x="710.0" y="700" text-anchor="middle" font-weight="bold" font-size="13">Sistemas corporativos detrás (no visibles para PGM, pero sí para su legado)</text><text x="710.0" y="718" text-anchor="middle" font-size="11" fill="#333">RIC (maestro clientes) · BDM · GESCOM · cores de ramo (Salud, Vida, Hogar, Autos) · GESYC (recibos) · METS · SGC 2.0/3.0 · PGO · SGO · NSE · FAC (Ficha Ampliada, a decomisionar)</text></svg>