<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#212121}
      .s{font-size:12.5px;fill:#37474f}
      .xs{font-size:11.5px;fill:#546e7a}
      .w{font-size:12.5px;fill:#fff;font-weight:600}
      .l{stroke:#37474f;stroke-width:1.8;fill:none;marker-end:url(#f)}
      .ld{stroke:#78909c;stroke-width:1.6;fill:none;stroke-dasharray:6 5;marker-end:url(#f)}
      .lab{font-size:11.5px;fill:#263238;font-weight:600}
    </style>
  </defs>
  <rect width="1600" height="1010" fill="#fff"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#212121">PGM en la arquitectura de referencia — lo que hay montado en la rama feature/pgm</text>
  <text x="40" y="68" class="s">SPA + BFF construidos con el harness KDD (WRK-SPEC-NEW-SPA-001 · WRK-SPEC-NEW-BFF-001). Todo lo demás es plataforma corporativa que PGM consume.</text>

  <!-- Leyenda -->
  <g transform="translate(1010,22)">
    <rect width="16" height="16" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="22" y="13" class="xs">Construido en feature/pgm</text>
    <rect x="190" width="16" height="16" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/><text x="212" y="13" class="xs">Corporativo existente</text>
    <rect x="360" width="16" height="16" rx="3" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/><text x="382" y="13" class="xs">Pendiente de MAPFRE</text>
    <rect y="24" width="16" height="16" rx="3" fill="#fafafa" stroke="#90a4ae" stroke-width="2" stroke-dasharray="4 3"/><text x="22" y="37" class="xs">Solo enlace (lanzadera)</text>
    <rect x="190" y="24" width="16" height="16" rx="3" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="212" y="37" class="xs">Prohibido / no se usa</text>
  </g>

  <!-- Columna usuario -->
  <rect x="40" y="110" width="250" height="90" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="60" y="140" class="t">Usuario de oficina</text>
  <text x="60" y="160" class="s">Navegador corporativo</text>
  <text x="60" y="178" class="xs">Asesor, director, gestor…</text>

  <rect x="40" y="300" width="250" height="140" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="60" y="328" class="t">Entra ID</text>
  <text x="60" y="348" class="s">OIDC code + PKCE (SPA)</text>
  <text x="60" y="366" class="s">JWT con scope (BFF)</text>
  <text x="60" y="390" class="xs">Pendiente: App Registrations</text>
  <text x="60" y="406" class="xs">APP-ESP-…-PGM-SPA/BFF-{ENTORNO}</text>
  <text x="60" y="422" class="xs">(PAT-ENTRAID-001)</text>

  <rect x="40" y="520" width="250" height="120" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="548" class="t">Appian PGM_MAPFRE</text>
  <text x="60" y="568" class="s">Convive durante la migración</text>
  <text x="60" y="586" class="xs">Estrategia strangler por fases</text>
  <text x="60" y="602" class="xs">(docs/pgm/04 · 5 fases)</text>

  <!-- SPA -->
  <rect x="360" y="100" width="360" height="210" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="380" y="128" class="t">① pgm-spa  ·  Angular 19 + Nx 20</text>
  <text x="380" y="148" class="xs">ARQT-ANGULAR-001@1.1.0 · BP-API-001@1.0.0</text>
  <g class="s">
    <text x="380" y="174">• Inicio y buscador multicriterio</text>
    <text x="380" y="192">• Ficha 360: palancas, resumen por ramo,</text>
    <text x="392" y="208">posición, gestión comercial, presupuestos</text>
    <text x="380" y="226">• Pólizas, recibos, prestaciones, N. producción,</text>
    <text x="392" y="242">cartera, utilidades, cuadro de mando</text>
    <text x="380" y="260">• Visibilidades que decide el BFF · Tarificación Salud</text>
    <text x="380" y="278">• Jest + Spectator · ESLint · Prettier · nginx no-root</text>
  </g>
  <text x="380" y="298" class="xs">Solo habla con el BFF (/api/v1). Nunca con API Canal.</text>

  <!-- BFF -->
  <rect x="360" y="370" width="360" height="400" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="380" y="398" class="t">② pgm-bff  ·  Spring Boot 3.5 / Java 21</text>
  <text x="380" y="418" class="xs">ARQT-SBOOT-001@1.0.1 · BP-API-001 · ARCH-FIS-COM-001</text>
  <g>
    <rect x="378" y="430" width="324" height="44" rx="5" fill="#fff" stroke="#81c784"/>
    <text x="390" y="449" class="s">API REST /api/v1 · contrato OpenAPI v1.1</text>
    <text x="390" y="466" class="xs">Errores RFC 9457 · Idempotency-Key en POST</text>
    <rect x="378" y="482" width="324" height="44" rx="5" fill="#fff" stroke="#81c784"/>
    <text x="390" y="501" class="s">Autorización: perfil Entra ID × SGC 3.0 × NUUMA</text>
    <text x="390" y="518" class="xs">+ feature flags → visibilidades para la SPA</text>
    <rect x="378" y="534" width="324" height="44" rx="5" fill="#fff" stroke="#81c784"/>
    <text x="390" y="553" class="s">Casos de uso (hexagonal) · auditoría · borradores</text>
    <text x="390" y="570" class="xs">Sin base de datos: PGM no es dueño de datos</text>
    <rect x="378" y="586" width="324" height="44" rx="5" fill="#fff" stroke="#81c784"/>
    <text x="390" y="605" class="s">Adaptadores de salida solo al API Gateway</text>
    <text x="390" y="622" class="xs">Timeouts · reintentos · circuit breaker (Resilience4j)</text>
    <rect x="378" y="638" width="324" height="44" rx="5" fill="#fff" stroke="#81c784"/>
    <text x="390" y="657" class="s">Observabilidad: /monitoring/health|metrics|prometheus</text>
    <text x="390" y="674" class="xs">Logs JSON sin PII · trace_id · OTLP</text>
    <rect x="378" y="690" width="324" height="66" rx="5" fill="#f1f8e9" stroke="#81c784" stroke-dasharray="4 3"/>
    <text x="390" y="709" class="s">Perfiles de ejecución</text>
    <text x="390" y="726" class="xs">local: datos sintéticos C-1001…C-1005</text>
    <text x="390" y="742" class="xs">simulador: adaptadores reales + Gateway simulado (WireMock)</text>
  </g>

  <!-- Gateway -->
  <rect x="790" y="370" width="200" height="400" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="808" y="400" class="t">③ API Gateway</text>
  <text x="808" y="418" class="t">interno</text>
  <text x="808" y="444" class="s">Toda llamada síncrona</text>
  <text x="808" y="462" class="s">entre plataformas</text>
  <text x="808" y="480" class="s">pasa por aquí</text>
  <text x="808" y="504" class="xs">(ARCH-FIS-COM-001 regla 1)</text>
  <text x="808" y="540" class="xs">Pendiente: URL por entorno,</text>
  <text x="808" y="556" class="xs">audience y suscripción</text>
  <text x="808" y="572" class="xs">de pgm-bff</text>

  <!-- API Canal -->
  <rect x="1060" y="100" width="500" height="250" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="1080" y="128" class="t">④ API Canal (productos de PCC)</text>
  <text x="1080" y="146" class="xs">Ya existen; falta que PCC confirme/publique los contratos que usa PGM</text>
  <g>
    <rect x="1080" y="160" width="145" height="52" rx="6" fill="#1565c0"/><text x="1092" y="182" class="w">Clientes</text><text x="1092" y="200" class="w" font-weight="400">ficha, búsqueda</text>
    <rect x="1238" y="160" width="145" height="52" rx="6" fill="#1565c0"/><text x="1250" y="182" class="w">Pólizas</text><text x="1250" y="200" class="w" font-weight="400">en vigor/anuladas</text>
    <rect x="1396" y="160" width="145" height="52" rx="6" fill="#1565c0"/><text x="1408" y="182" class="w">Recibos</text><text x="1408" y="200" class="w" font-weight="400">estado, IBAN</text>
    <rect x="1080" y="222" width="145" height="52" rx="6" fill="#1565c0"/><text x="1092" y="244" class="w">Siniestros</text><text x="1092" y="262" class="w" font-weight="400">prestaciones</text>
    <rect x="1238" y="222" width="145" height="52" rx="6" fill="#1565c0"/><text x="1250" y="244" class="w">Ventas</text><text x="1250" y="262" class="w" font-weight="400">presupuestos, tarifas</text>
    <rect x="1396" y="222" width="145" height="52" rx="6" fill="#fff3e0" stroke="#ef6c00"/><text x="1408" y="244" class="s" font-weight="600">Gaps a pedir</text><text x="1408" y="262" class="xs">docs/pgm/03 §4</text>
  </g>
  <text x="1080" y="300" class="xs">PGM no crea API Canal: la consume. Las capacidades que faltan se piden a PCC</text>
  <text x="1080" y="316" class="xs">(o se crean como productos nuevos con WRK-SPEC new-api, si se decide).</text>

  <!-- Plataformas -->
  <rect x="1060" y="390" width="500" height="200" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/>
  <text x="1080" y="418" class="t">⑤ APIs de plataforma (por el Gateway)</text>
  <text x="1080" y="436" class="xs">Lo que API Canal no cubre hoy. Las debe publicar el equipo dueño de cada sistema.</text>
  <g>
    <rect x="1080" y="450" width="90" height="44" rx="6" fill="#fff" stroke="#ef6c00"/><text x="1094" y="477" class="s" font-weight="600">PGO</text>
    <rect x="1178" y="450" width="90" height="44" rx="6" fill="#fff" stroke="#ef6c00"/><text x="1188" y="477" class="s" font-weight="600">SGC 3.0</text>
    <rect x="1276" y="450" width="90" height="44" rx="6" fill="#fff" stroke="#ef6c00"/><text x="1284" y="477" class="s" font-weight="600">iMediador</text>
    <rect x="1374" y="450" width="80" height="44" rx="6" fill="#fff" stroke="#ef6c00"/><text x="1396" y="477" class="s" font-weight="600">SGO</text>
    <rect x="1462" y="450" width="80" height="44" rx="6" fill="#fff" stroke="#ef6c00"/><text x="1470" y="470" class="xs" font-weight="600">Comunica-</text><text x="1470" y="486" class="xs" font-weight="600">ciones</text>
    <rect x="1080" y="504" width="210" height="44" rx="6" fill="#fff" stroke="#ef6c00"/><text x="1094" y="531" class="s" font-weight="600">ACI · Club · Consentimientos</text>
  </g>
  <text x="1080" y="572" class="xs">Mientras no existan: datos sintéticos (local) o WireMock (simulador).</text>

  <!-- Lanzaderas -->
  <rect x="1060" y="620" width="500" height="80" rx="10" fill="#fafafa" stroke="#90a4ae" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1080" y="648" class="t">⑥ Lanzaderas corporativas (solo enlace)</text>
  <text x="1080" y="670" class="s">NSE · GESALUD · GESVIDA/WEBVIDA · Portal Interno · SGC 3.0 · SGO · Citrix</text>
  <text x="1080" y="688" class="xs">La SPA abre la URL que entrega el BFF; no hay integración.</text>

  <!-- Legacy -->
  <rect x="1060" y="725" width="500" height="60" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="1080" y="751" class="t" fill="#b71c1c">✕ Legacy: ESB · SOAP · Denodo · API Clientes legacy · BBDD</text>
  <text x="1080" y="770" class="xs">Ningún adaptador del BFF apunta aquí (requisito: “todo va por lo nuevo”).</text>

  <!-- Plataforma técnica -->
  <rect x="40" y="820" width="1520" height="160" rx="10" fill="#fff" stroke="#b0bec5" stroke-width="2"/>
  <text x="60" y="848" class="t">⑦ Plataforma técnica y operación</text>
  <g>
    <rect x="60" y="864" width="280" height="96" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="74" y="886" class="s" font-weight="600">Preparado en el repo</text>
    <text x="74" y="904" class="xs">Workflows pull-request / merge-commit</text>
    <text x="74" y="920" class="xs">Dockerfiles no-root · docker/podman compose</text>
    <text x="74" y="936" class="xs">catalog-info.yaml · sonar-project.properties</text>
    <text x="74" y="952" class="xs">Manifiestos EKS (kustomize dev/pre/pro)</text>
    <rect x="360" y="864" width="280" height="96" rx="6" fill="#fff3e0" stroke="#ef6c00"/>
    <text x="374" y="886" class="s" font-weight="600">Zeus / Backstage / SRE</text>
    <text x="374" y="904" class="xs">Alta del componente y Marketplace</text>
    <text x="374" y="920" class="xs">Onboarding ZeusOneteam-…ArqContJava</text>
    <text x="374" y="936" class="xs">Workflow ZeusOneteam-CI-FrontSPA</text>
    <text x="374" y="952" class="xs">Imágenes acrmapfredevops · Azure Artifacts</text>
    <rect x="660" y="864" width="280" height="96" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
    <text x="674" y="886" class="s" font-weight="600">EKS (entornos dev · pre · pro)</text>
    <text x="674" y="904" class="xs">SPA (nginx) y BFF como despliegues</text>
    <text x="674" y="920" class="xs">Secretos en gestor corporativo</text>
    <text x="674" y="936" class="xs">Probes /monitoring/health/liveness|readiness</text>
    <text x="674" y="952" class="xs">HPA · PodDisruptionBudget</text>
    <rect x="960" y="864" width="280" height="96" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
    <text x="974" y="886" class="s" font-weight="600">Observabilidad corporativa</text>
    <text x="974" y="904" class="xs">Prometheus ← /monitoring/prometheus</text>
    <text x="974" y="920" class="xs">Tempo ← OTLP (traceparent W3C)</text>
    <text x="974" y="936" class="xs">Logs JSON con trace_id, sin PII</text>
    <text x="974" y="952" class="xs">PAT-OBSERVABILIDAD-JAVA-001</text>
    <rect x="1260" y="864" width="280" height="96" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="1274" y="886" class="s" font-weight="600">Harness KDD</text>
    <text x="1274" y="904" class="xs">.kdd/WRK-SPEC congelados</text>
    <text x="1274" y="920" class="xs">docs/pgm/05 revisión de cumplimiento</text>
    <text x="1274" y="936" class="xs">Pendiente: PR + spec-consolidate</text>
    <text x="1274" y="952" class="xs">(requieren tu confirmación)</text>
  </g>

  <!-- Flechas -->
  <path class="l" d="M290 155 H356"/><text x="296" y="146" class="lab">HTTPS</text>
  <path class="l" d="M440 310 V366"/><text x="448" y="344" class="lab">/api/v1 · Bearer JWT · Idempotency-Key</text>
  <path class="l" d="M360 260 C 320 260 320 340 294 340"/><text x="214" y="292" class="lab">login OIDC</text>
  <path class="l" d="M360 430 C 330 430 320 410 294 410"/><text x="296" y="458" class="lab">valida JWT</text>
  <path class="l" d="M720 600 H786"/><text x="726" y="590" class="lab">HTTPS s2s</text>
  <path class="l" d="M990 450 C 1030 450 1020 230 1056 230"/>
  <path class="l" d="M990 500 H1056"/>
  <path class="ld" d="M720 290 H 1025 V 660 H 1056"/><text x="740" y="282" class="lab">abre enlaces (lanzaderas)</text>
  <path d="M700 770 V 798 H 1035 V 760 H 1056" stroke="#c62828" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#fr)"/>
  <text x="860" y="806" font-size="22" font-weight="700" fill="#c62828">✕</text>
  <path class="ld" d="M40 600 H 24 V 160 H 36"/><text x="30" y="500" class="lab" transform="rotate(-90 30 500)">convive (strangler)</text>
</svg>
