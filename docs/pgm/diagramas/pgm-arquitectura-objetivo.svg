<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs><rect width="100%" height="100%" fill="#fafafa"/><text x="700.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#c8102e">PGM — arquitectura objetivo (SPA Angular + BFF Spring Boot sobre API Canal)</text><rect x="560" y="60" width="280" height="60" rx="8" fill="#fff5f5" stroke="#c8102e" stroke-width="1.5"/><text x="700.0" y="80" text-anchor="middle" font-weight="bold" font-size="13">Usuario de oficina MAPFRE</text><text x="700.0" y="98" text-anchor="middle" font-size="11" fill="#333">OIDC Microsoft Entra ID · grupos = perfiles</text><line x1="700" y1="120" x2="700" y2="150" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><rect x="400" y="150" width="600" height="80" rx="8" fill="#f3f7ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="700.0" y="170" text-anchor="middle" font-weight="bold" font-size="13">pgm-spa — Angular + Nx  (ARQT-ANGULAR-001)</text><text x="700.0" y="188" text-anchor="middle" font-size="11" fill="#333">/inicio · /clientes/:id (posición · gestión comercial · presupuestos) · /polizas/:id · /recibos · /prestaciones</text><text x="700.0" y="203" text-anchor="middle" font-size="11" fill="#333">/nueva-produccion · /gestion-cartera · /utilidades · deep links que sustituyen a las Web APIs Appian</text><line x1="700" y1="230" x2="700" y2="265" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="704.0" y="243.5" font-size="10" fill="#555">HTTPS/JSON · JWT usuario</text><rect x="300" y="265" width="800" height="110" rx="8" fill="#f3f7ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="700.0" y="285" text-anchor="middle" font-weight="bold" font-size="13">pgm-bff — Spring Boot 3 / Java 21  (ARQT-SBOOT-001 · BP-API-001 · ARCH-FIS-COM-001)</text><text x="700.0" y="303" text-anchor="middle" font-size="11" fill="#333">OpenAPI-first /api/v1 · OAuth2 resource server Entra ID · s2s client-credentials por tenant · hexagonal</text><text x="700.0" y="318" text-anchor="middle" font-size="11" fill="#333">journey PGM: composición de la ficha 360 por pestaña · autorización perfil × estructura comercial · feature flags (pilotos)</text><text x="700.0" y="333" text-anchor="middle" font-size="11" fill="#333">catálogo de lanzaderas · auditoría NUUMA · borradores tarificación · SIN caché de datos de cliente ni lógica de dominio</text><line x1="450" y1="375" x2="300" y2="450" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="379.0" y="408.5" font-size="10" fill="#555">s2s JWT</text><line x1="700" y1="375" x2="700" y2="450" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="704.0" y="408.5" font-size="10" fill="#555">s2s JWT</text><line x1="950" y1="375" x2="1100" y2="450" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="1029.0" y="408.5" font-size="10" fill="#555">API Gateway interno</text><rect x="120" y="450" width="360" height="150" rx="8" fill="#eefbf0" stroke="#2b8a3e" stroke-width="1.5"/><text x="300.0" y="470" text-anchor="middle" font-weight="bold" font-size="13">API Canal Clientes (PROD-APICANAL-CLIENTES-001)</text><text x="300.0" y="488" text-anchor="middle" font-size="11" fill="#333">visión 360 nivel 1 desde ODL MongoDB apichannel</text><text x="300.0" y="503" text-anchor="middle" font-size="11" fill="#333">search · individuals/companies · contactMethods</text><text x="300.0" y="518" text-anchor="middle" font-size="11" fill="#333">families · healthCards · catalogs · bankingPosition</text><text x="300.0" y="533" text-anchor="middle" font-size="11" fill="#333">crosselling · originsInfo · validations</text><text x="300.0" y="548" text-anchor="middle" font-size="11" fill="#333">+ a solicitar: criterios búsqueda, alertas,</text><text x="300.0" y="563" text-anchor="middle" font-size="11" fill="#333">interacciones, integralidad, consentimientos</text><rect x="520" y="450" width="360" height="150" rx="8" fill="#eefbf0" stroke="#2b8a3e" stroke-width="1.5"/><text x="700.0" y="470" text-anchor="middle" font-weight="bold" font-size="13">API Canal Pólizas · Recibos · Siniestros · Ventas</text><text x="700.0" y="488" text-anchor="middle" font-size="11" fill="#333">POLIZAS: detalle, tipo, documentos (duplicados)</text><text x="700.0" y="503" text-anchor="middle" font-size="11" fill="#333">RECIBOS: visión METS (+ operativas a solicitar)</text><text x="700.0" y="518" text-anchor="middle" font-size="11" fill="#333">SINIESTROS: claims, accidents, proceedings</text><text x="700.0" y="533" text-anchor="middle" font-size="11" fill="#333">VENTAS: quote/resume/sign Salud, ofertas</text><text x="700.0" y="548" text-anchor="middle" font-size="11" fill="#333">Resiliencia (timeouts, CB, caché) y trazabilidad</text><text x="700.0" y="563" text-anchor="middle" font-size="11" fill="#333">en API Canal · proxy v0 → API Plataforma</text><rect x="920" y="450" width="360" height="150" rx="8" fill="#fff8e1" stroke="#b7791f" stroke-width="1.5"/><text x="1100.0" y="470" text-anchor="middle" font-weight="bold" font-size="13">APIs de Plataforma / producto vía API Gateway</text><text x="1100.0" y="488" text-anchor="middle" font-size="11" fill="#333">PGO oportunidades (/apipgo) · SGC 3.0 gestiones</text><text x="1100.0" y="503" text-anchor="middle" font-size="11" fill="#333">iMediador actividades · estructura comercial</text><text x="1100.0" y="518" text-anchor="middle" font-size="11" fill="#333">SGO solicitudes · ACI / Club MAPFRE · consentimientos</text><text x="1100.0" y="533" text-anchor="middle" font-size="11" fill="#333">comunicaciones (click-to-call, WhatsApp)</text><text x="1100.0" y="548" text-anchor="middle" font-size="11" fill="#333">Partners (Verti · Santander · SAVIA) → BFP</text><text x="1100.0" y="563" text-anchor="middle" font-size="11" fill="#333">(gap: sin PROD-APICANAL, decisión con PCC)</text><line x1="300" y1="600" x2="300" y2="650" stroke="#555" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><text x="304.0" y="621.0" font-size="10" fill="#555">proxy v0 / API Plataforma</text><line x1="700" y1="600" x2="700" y2="650" stroke="#555" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><line x1="1100" y1="600" x2="1100" y2="650" stroke="#555" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><rect x="120" y="650" width="1160" height="80" rx="8" fill="#fff" stroke="#999" stroke-width="1.5"/><text x="700.0" y="670" text-anchor="middle" font-weight="bold" font-size="13">Plataformas y cores</text><text x="700.0" y="688" text-anchor="middle" font-size="11" fill="#333">RIC (maestro clientes → eventos Kafka → Denodo → ODL) · GESYC recibos · METS · cores de ramo Salud/Vida/Hogar/Autos · PGO · SGC · SGO · NSE · ACI · Club</text><rect x="120" y="760" width="560" height="110" rx="8" fill="#fff0f0" stroke="#c8102e" stroke-width="1.5"/><text x="400.0" y="780" text-anchor="middle" font-weight="bold" font-size="13">Desaparece</text><text x="400.0" y="798" text-anchor="middle" font-size="11" fill="#333">Caché PostgreSQL/Appian de la ficha (PII) · records contenedores · 127 PM de orquestación</text><text x="400.0" y="813" text-anchor="middle" font-size="11" fill="#333">Web APIs de entrada · 73 integraciones sin uso · URLs hardcoded · FAC (Ficha Ampliada)</text><text x="400.0" y="828" text-anchor="middle" font-size="11" fill="#333">Appian PGM_MAPFRE tras la fase 5 (strangler por dominio)</text><rect x="720" y="760" width="560" height="110" rx="8" fill="#f1f1f1" stroke="#666" stroke-width="1.5"/><text x="1000.0" y="780" text-anchor="middle" font-weight="bold" font-size="13">Transversal (BP-API-001)</text><text x="1000.0" y="798" text-anchor="middle" font-size="11" fill="#333">Observabilidad: logs JSON sin PII · OTLP · Prometheus/Grafana (métricas de negocio sustituyen al cuadro de mando)</text><text x="1000.0" y="813" text-anchor="middle" font-size="11" fill="#333">CI/CD Zeus OneTeam · GitHub Actions · SonarQube · Backstage catalog-info · Argo CD</text><text x="1000.0" y="828" text-anchor="middle" font-size="11" fill="#333">Secretos en Key Vault · JWT normalizados (deuda reconocida en ARCH-APICANAL-001)</text></svg>