services:
  esp-appianesad-tva:
    build:
      context: ..
      dockerfile: docker/Dockerfile.public
    ports:
      - "8888:8888"
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: local
      DB_HOST: postgres
      DB_NAME: tva
      DB_USER: tva
      DB_PASSWORD: tva
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tva
      POSTGRES_USER: tva
      POSTGRES_PASSWORD: tva
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres-data:
