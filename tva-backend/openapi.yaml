          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - docs
      security:
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    AccionRequest:
      type: object
      description: Body opcional de POST /sesiones/{clave}/acciones/{accion}.
      properties:
        datos: {}
    CanalEnum:
      enum:
      - GV
      - PFM
      - OTRO
      type: string
      description: |-
        * `GV` - GESVIDA
        * `PFM` - PFM
        * `OTRO` - Otro
    ClaseEnum:
      enum:
      - INFO
      - ERROR
      - AVISO
      type: string
      description: |-
        * `INFO` - Info
        * `ERROR` - Error
        * `AVISO` - Aviso
    InicioRequest:
      type: object
      description: Body de POST /inicio/ahorro y /inicio/rentas.
      properties:
        indFunctionMode:
          type: string
          maxLength: 5
        proposalId:
          type: string
        companyId:
          type: string
          maxLength: 10
        distributionChannel:
          type: string
          maxLength: 10
        username:
          type: string
        policyHolders:
          type: array
          items: {}
        investment:
          type: array
          items: {}
        documentoCliente:
          type: string
          maxLength: 20
        canal:
          allOf:
          - $ref: '#/components/schemas/CanalEnum'
          default: OTRO
        codigoProductor:
          type: string
          default: ''
          maxLength: 20
        propuesta: {}
    ModalidadEnum:
      enum:
      - VA
      - VIA
      - R2C
      type: string
      description: |-
        * `VA` - Venta asesorada
        * `VIA` - Venta informada
        * `R2C` - Rentas (R2C)
    PantallaActualEnum:
      enum:
      - SISTEMA_CERRADO
      - SIN_PERFIL
      - SOLO_AVISOS
      - SELECCION_PRODUCTO_AHORRO
      - SEGUROS_AHORRO
      - MODALIDAD_CAMPANIA
      - CAPTURA_DATOS_SOLICITUD
      - CAPTURA_TOMADOR1
      - CAPTURA_TOMADOR2
      - RESUMEN_CONTRATACION
      - RESULTADO_FIRMA
      - R2C_CAPTURA
      - R2C_PRECIOS
      - ADMINISTRACION
      - FIN
      type: string
      description: |-
        * `SISTEMA_CERRADO` - Sistema cerrado
        * `SIN_PERFIL` - Sin perfil
        * `SOLO_AVISOS` - Sólo avisos
        * `SELECCION_PRODUCTO_AHORRO` - Selección producto ahorro
        * `SEGUROS_AHORRO` - Seguros ahorro
        * `MODALIDAD_CAMPANIA` - Modalidad campaña
        * `CAPTURA_DATOS_SOLICITUD` - Captura datos solicitud
        * `CAPTURA_TOMADOR1` - Captura tomador 1
        * `CAPTURA_TOMADOR2` - Captura tomador 2
        * `RESUMEN_CONTRATACION` - Resumen contratación
        * `RESULTADO_FIRMA` - Resultado firma
        * `R2C_CAPTURA` - R2C captura
        * `R2C_PRECIOS` - R2C precios
        * `ADMINISTRACION` - Administración
        * `FIN` - Fin
    Parametro:
      type: object
      properties:
        clave:
          type: string
          maxLength: 128
        valor:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoEnum'
        descripcion:
          type: string
        entorno:
          type: string
          nullable: true
          maxLength: 16
        actualizado:
          type: string
          format: date-time
          readOnly: true
      required:
      - actualizado
      - clave
    Sesion:
      type: object
      description: Vista completa de la sesión (GET /sesiones/{clave}).
      properties:
        clave:
          type: string
          format: uuid
          readOnly: true
        usuario:
          type: string
          readOnly: true
        modalidad:
          allOf:
          - $ref: '#/components/schemas/ModalidadEnum'
          readOnly: true
        canal:
          allOf:
          - $ref: '#/components/schemas/CanalEnum'
          readOnly: true
        pantalla_actual:
          allOf:
          - $ref: '#/components/schemas/PantallaActualEnum'
          readOnly: true
        version_esquema:
          type: integer
          readOnly: true
        estado:
          readOnly: true
        abierta:
          type: boolean
          readOnly: true
        creado:
          type: string
          format: date-time
          readOnly: true
        actualizado:
          type: string
          format: date-time
          readOnly: true
      required:
      - abierta
      - actualizado
      - canal
      - clave
      - creado
      - estado
      - modalidad
      - pantalla_actual
      - usuario
      - version_esquema
    SesionEstado:
      type: object
      description: PUT /sesiones/{clave}/estado — sustituye el estado JSON completo.
      properties:
        estado: {}
        version_esquema:
          type: integer
          minimum: 1
      required:
      - estado
    TipoEnum:
      enum:
      - str
      - int
      - bool
      - json
      type: string
      description: |-
        * `str` - Texto
        * `int` - Entero
        * `bool` - Booleano
        * `json` - JSON
    Traza:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        clave_sesion:
          type: string
          maxLength: 64
        tipo_contenido:
          type: string
          maxLength: 64
        clase:
          $ref: '#/components/schemas/ClaseEnum'
        mensaje:
          type: string
        datos: {}
        creado:
          type: string
          format: date-time
          readOnly: true
      required:
      - creado
      - id
