openapi: 3.0.3
info:
  title: TVA — Tarificador Vida Ahorro
  version: 1.0.0
  description: API del tarificador de productos Vida Ahorro (migración de la aplicación
    Appian TVA).
paths:
  /api/tva/v1/admin/apertura-cierre/:
    post:
      operationId: api_tva_v1_admin_apertura_cierre_create
      description: POST /admin/apertura-cierre/ — batch manual de apertura/cierre
        programado.
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/tva/v1/admin/caches/limpiar/:
    post:
      operationId: api_tva_v1_admin_caches_limpiar_create
      description: POST /admin/caches/limpiar/ — invalida las cachés de la app.
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/tva/v1/admin/parametros/:
    get:
      operationId: api_tva_v1_admin_parametros_list
      description: GET/PUT /admin/parametros/ — edición de parámetros (constantes
        Appian).
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parametro'
          description: ''
    put:
      operationId: api_tva_v1_admin_parametros_update
      description: GET/PUT /admin/parametros/ — edición de parámetros (constantes
        Appian).
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Parametro'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Parametro'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Parametro'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parametro'
          description: ''
  /api/tva/v1/admin/trazas/:
    get:
      operationId: api_tva_v1_admin_trazas_list
      description: GET /admin/trazas/?clave= — log de aplicación (equiv. TVA_Utilidades_Log).
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Traza'
          description: ''
  /api/tva/v1/catalogos/{nombre}/:
    get:
      operationId: api_tva_v1_catalogos_retrieve
      description: GET /catalogos/<nombre>/ — catálogo estático desde fixtures/catalogos/.
      parameters:
      - in: path
        name: nombre
        schema:
          type: string
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/tva/v1/clientes/:
    get:
      operationId: api_tva_v1_clientes_retrieve
      description: GET /clientes/?documento= ��� búsqueda RIC + API Life.
      parameters:
      - in: query
        name: documento
        schema:
          type: string
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
        '400':
          description: No response body
  /api/tva/v1/inicio/ahorro/:
    post:
      operationId: api_tva_v1_inicio_ahorro_create
      description: POST /inicio/ahorro — venta asesorada/informada (productos ahorro).
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InicioRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InicioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InicioRequest'
      responses:
        '201':
          description: No response body
        '400':
          description: No response body
        '403':
          description: No response body
  /api/tva/v1/inicio/rentas/:
    post:
      operationId: api_tva_v1_inicio_rentas_create
      description: POST /inicio/rentas — simulador de rentas (R2C).
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InicioRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InicioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InicioRequest'
      responses:
        '201':
          description: No response body
        '400':
          description: No response body
        '403':
          description: No response body
  /api/tva/v1/productos/:
    get:
      operationId: api_tva_v1_productos_retrieve
      description: GET /productos/ — catálogo del taller cacheado (params opcionales).
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/tva/v1/salud/:
    get:
      operationId: api_tva_v1_salud_retrieve
      description: GET /api/tva/v1/salud/ — healthcheck público.
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
          description: ''
  /api/tva/v1/sesiones/{clave}/:
    get:
      operationId: api_tva_v1_sesiones_retrieve
      description: GET /sesiones/{clave}/ — estado completo de la sesión.
      parameters:
      - in: path
        name: clave
        schema:
          type: string
        required: true
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
          description: ''
        '404':
          description: No response body
  /api/tva/v1/sesiones/{clave}/acciones/{accion}/:
    post:
      operationId: api_tva_v1_sesiones_acciones_create
      description: POST /sesiones/{clave}/acciones/{accion}/ — ejecuta un caso de
        uso.
      parameters:
      - in: path
        name: accion
        schema:
          type: string
        required: true
      - in: query
        name: accion
        schema:
          type: string
          enum:
          - administracion
          - anterior
          - cancelar
          - continuar-tomador
          - contratar
          - contratar-rentas
          - doc-precontractual
          - firmar
          - guardar-solicitud
          - importe-maximo
          - recalcular-rentas
          - seleccionar-modalidad
          - siguiente
          - validar-reinversion
          - validar-seccion
          - verificar-productores
          - volver-administracion
      - in: path
        name: clave
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccionRequest'
      responses:
        '200':
          description: No response body
        '400':
          description: No response body
        '404':
          description: No response body
  /api/tva/v1/sesiones/{clave}/documentos/{tipo}/:
    get:
      operationId: api_tva_v1_sesiones_documentos_retrieve
      description: GET /sesiones/{clave}/documentos/{tipo}/ — metadatos/base64 del
        documento.
      parameters:
      - in: path
        name: clave
        schema:
          type: string
        required: true
      - in: path
        name: tipo
        schema:
          type: string
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
        '404':
          description: No response body
  /api/tva/v1/sesiones/{clave}/estado/:
    put:
      operationId: api_tva_v1_sesiones_estado_update
      description: PUT /sesiones/{clave}/estado/ — sustituye el estado JSON.
      parameters:
      - in: path
        name: clave
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SesionEstado'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SesionEstado'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SesionEstado'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
          description: ''
        '400':
          description: No response body
        '404':
          description: No response body
  /docs/schema/:
    get:
      operationId: docs_schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
