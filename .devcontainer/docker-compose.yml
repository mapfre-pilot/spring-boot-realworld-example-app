name: tva-devcontainer

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/tva:cached
      - tva-node-modules:/workspaces/tva/tva-frontend/node_modules
      - tva-pnpm-store:/home/vscode/.local/share/pnpm
    command: sleep infinity
    environment:
      ENVIRONMENT: local
      DB_HOST: postgres
      DB_NAME: tva
      DB_USER: tva
      DB_PASSWORD: tva
      DB_PORT: 5432
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      APILIFE_MODE: ${APILIFE_MODE:-mock}
      MISV_MODE: ${MISV_MODE:-mock}
      RIC_MODE: ${RIC_MODE:-mock}
      PERFIL_USUARIO_MODE: ${PERFIL_USUARIO_MODE:-mock}
      APPIAN_EMBED_MODE: ${APPIAN_EMBED_MODE:-mock}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tva
      POSTGRES_USER: tva
      POSTGRES_PASSWORD: tva
    volumes:
      - tva-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tva -d tva"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7

volumes:
  tva-node-modules:
  tva-pnpm-store:
  tva-postgres-data:
