# PGM en arquitectura de referencia — arranque local completo (SPA + BFF) con datos sintéticos.
#   docker compose -f pgm/docker-compose.yml up --build
#   SPA: http://localhost:4200   BFF: http://localhost:8080 (health: /monitoring/health, OpenAPI: /v3/api-docs.yaml)
services:
  bff:
    build:
      context: ../pgm-bff
      dockerfile: docker/Dockerfile
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-https://repo.maven.apache.org/maven2}
        BUILD_IMAGE: ${BUILD_IMAGE:-maven:3.9.11-eclipse-temurin-21-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-eclipse-temurin:21-jre-alpine}
    image: pgm-bff:local
    environment:
      SPRING_PROFILES_ACTIVE: local
      APP_CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "${BFF_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/monitoring/health"]
      interval: 15s
      timeout: 3s
      retries: 10
  spa:
    build:
      context: ../pgm-spa
      dockerfile: docker/Dockerfile
      args:
        CONFIGURATION: local
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.27-alpine}
    image: pgm-spa:local
    environment:
      BFF_URL: http://bff:8080
    ports:
      - "${SPA_PORT:-4200}:8080"
    depends_on:
      bff:
        condition: service_healthy
