[project]
name = "esp-appianesad-tva"
version = "0.1.0-dev"
description = "tarificador vida ahorro"
readme = "README.md"
authors = []
license = { text = "" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "gunicorn==22.0.0",
    "requests==2.34.2",
    "django (>=5.2,<6.0)",
    "djangorestframework==3.17.1",
    "djangorestframework-simplejwt==5.5.1",
    "django-extensions (>=4.1.0,<5.0.0)",
    "drf-spectacular==0.29.0",
    "drf-spectacular-sidecar==2026.5.1",
    "arch-ram-lib-django-observability (>=1.0.0,<2.0.0)",
    "arch-ram-lib-django-auth (>=1.0.0,<2.0.0)",
    "arch-ram-lib-django-httpclient (>=2.0.0,<3.0.0)",
    "arch-ram-lib-django-rediscache (>=2.0.0,<3.0.0)",
    "arch-ram-lib-django-kafkaevent (>=2.0.0,<3.0.0)",
    "arch-ram-lib-django-mongoatlas (>=2.0.0,<3.0.0)",
    "arch-ram-lib-django-storages (>=2.0.0,<3.0.0)",
    "arch-ram-lib-django-celery (>=2.0.0,<3.0.0)",
    "esp-archbacksp-lib-django-admin (>=1.0.0,<2.0.0)",
]
archetypeVersion = "1.12.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# --- Poetry - Configuration -----------------------------------------
[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "azure"
url = "https://pkgs.dev.azure.com/devopsmapfre/devopsmapfre/_packaging/snapshots/pypi/simple/"
priority = "supplemental"

# --- Development ----------------------------------------------------
[tool.poetry.group.dev]
optional = false

[tool.poetry.group.dev.dependencies]
ipdb = "^0.13.13"
pre-commit = "^4.2.0"

# --- Linters & Formatters -------------------------------------------
[tool.poetry.group.lint]
optional = false

[tool.poetry.group.lint.dependencies]
ruff = "^0.14.6"
pyright = { version = "^1.1.407", extras = ["nodejs"] }

# --- Testing --------------------------------------------------------
[tool.poetry.group.tests]
optional = false

[tool.poetry.group.tests.dependencies]
coverage = "^7.8.0"
pytest = "^9.0.0"
pytest-cov = "^6.0.0"
pytest-django = "^4.12.0"
pytest-mock = "^3.14.1"

# --- Pytest - Unit Testing ------------------------------------------
[tool.pytest.ini_options]
minversion = "8.3.4"
addopts = "-v --cov=apps --cov-branch --cov-report=term-missing"
python_files = ["*/test_*.py"]
cache_dir = "/tmp/.pytest_cache"
DJANGO_SETTINGS_MODULE = "config.settings"

# --- Coverage - Code coverage ---------------------------------------
[tool.coverage.run]
data_file = "/tmp/.coverage"
relative_files = true
omit = [
    "**/tests/**",
    "**/migrations/**",
    "**/conftest.py",
    "config/*",
    "manage.py",
]

[tool.coverage.report]
skip_empty = true
fail_under = 80
precision = 2

# --- Ruff - Linting and Formatting ----------------------------------
[tool.ruff]
line-length = 140
target-version = "py311"
indent-width = 4
exclude = [".git", "__pycache__", "docs"]
include = ["*.py", "*.pyi"]
cache-dir = "/tmp/.ruff"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 120

[tool.ruff.lint]
# select = ["C", "E", "F", "W", "B", "B950"]
ignore = ["E203", "E501", "W605", "C901"]
