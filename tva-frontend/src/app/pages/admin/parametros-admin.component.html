@if (parametros().length) {
  <table mat-table [dataSource]="parametros()" class="tabla">
    <ng-container matColumnDef="clave">
      <th mat-header-cell *matHeaderCellDef>Clave</th>
      <td mat-cell *matCellDef="let p" class="col-clave">{{ p.clave }}</td>
    </ng-container>
    <ng-container matColumnDef="valor">
      <th mat-header-cell *matHeaderCellDef>Valor</th>
      <td mat-cell *matCellDef="let p">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="campo-valor">
          <input matInput [value]="p.valor" (change)="guardar(p, $any($event.target).value)" />
        </mat-form-field>
      </td>
    </ng-container>
    <ng-container matColumnDef="tipo">
      <th mat-header-cell *matHeaderCellDef class="col-tipo">Tipo</th>
      <td mat-cell *matCellDef="let p" class="col-tipo">{{ p.tipo }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas"></tr>
  </table>
} @else {
  <app-estado-vacio mensaje="Sin parámetros" icono="tune" />
}
