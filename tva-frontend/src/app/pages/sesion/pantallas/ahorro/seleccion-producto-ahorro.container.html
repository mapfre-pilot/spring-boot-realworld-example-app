<app-encabezado-pantalla titulo="Selecciona un producto" />

<mat-form-field class="filtro" appearance="outline" subscriptSizing="dynamic">
  <mat-label>Buscar producto</mat-label>
  <input matInput [formControl]="filtro" />
  <mat-icon matIconPrefix aria-hidden="true">search</mat-icon>
</mat-form-field>

@if (productos().length === 0) {
  <app-estado-vacio [mensaje]="MSG" icono="inventory_2" />
} @else {
  <div class="grid">
    @for (p of productosFiltrados(); track p.commercialProductCode) {
      <mat-card class="tarjeta" appearance="outlined">
        <mat-card-header>
          <span class="chip-codigo">{{ p.commercialProductCode }}</span>
          <mat-card-title>{{ p.commercialProductDesc }}</mat-card-title>
        </mat-card-header>
        <mat-card-actions align="end">
          <button mat-stroked-button color="primary" type="button" (click)="contratar(p)">
            Contratar <mat-icon aria-hidden="true">arrow_forward</mat-icon>
          </button>
        </mat-card-actions>
      </mat-card>
    }
    @if (!productosFiltrados().length) {
      <app-estado-vacio
        mensaje="No hay productos que coincidan con la búsqueda"
        icono="search_off" />
    }
  </div>
}
