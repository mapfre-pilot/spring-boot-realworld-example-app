<app-panel-resultado [tipo]="tipoPanel()" titulo="Resultado de la firma" [mensaje]="mensaje()">
  <app-lista-datos [items]="items()" [columnas]="3" class="datos" />

  @if (documentos().length) {
    <mat-list class="docs">
      @for (doc of documentos(); track doc.name) {
        <mat-list-item>
          <mat-icon matListItemIcon aria-hidden="true">picture_as_pdf</mat-icon>
          <span matListItemTitle>{{ doc.name }}</span>
          @if (doc.documentType) {
            <span matListItemLine>{{ doc.documentType }}</span>
          }
        </mat-list-item>
      }
    </mat-list>
  }

  <mat-expansion-panel class="detalle">
    <mat-expansion-panel-header>
      <mat-panel-title>Detalle técnico</mat-panel-title>
    </mat-expansion-panel-header>
    <pre>{{ resultado() }}</pre>
  </mat-expansion-panel>

  <button acciones mat-flat-button color="primary" type="button" (click)="finalizar()">
    Finalizar
  </button>
</app-panel-resultado>
