<mat-card class="panel panel-{{ tipo() }}" [attr.data-tipo]="tipo()">
  <mat-card-content class="cuerpo">
    <mat-icon class="icono" aria-hidden="true">{{ icono() }}</mat-icon>
    <h2 class="titulo">{{ titulo() }}</h2>
    @if (mensaje()) {
      <p class="mensaje">{{ mensaje() }}</p>
    }
    <ng-content />
    <div class="acciones">
      <ng-content select="[acciones]" />
    </div>
  </mat-card-content>
</mat-card>
