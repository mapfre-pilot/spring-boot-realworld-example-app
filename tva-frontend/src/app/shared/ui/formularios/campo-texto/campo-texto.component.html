<mat-form-field appearance="outline" class="campo" [subscriptSizing]="subscriptSizing()">
  <mat-label>{{ etiqueta() }}</mat-label>
  <input matInput [formControl]="control()" [type]="tipo()" [placeholder]="placeholder()" />
  @if (pista()) {
    <mat-hint>{{ pista() }}</mat-hint>
  }
  @if (sufijo()) {
    <span matTextSuffix>{{ sufijo() }}</span>
  }
  @if (control().invalid && control().touched) {
    <mat-error>Valor obligatorio o inválido</mat-error>
  }
</mat-form-field>
