<mat-form-field appearance="outline" class="campo" [subscriptSizing]="subscriptSizing()">
  <mat-label>{{ etiqueta() }}</mat-label>
  <mat-select [formControl]="control()">
    @for (op of opciones(); track op.valor) {
      <mat-option [value]="op.valor">{{ op.etiqueta }}</mat-option>
    }
  </mat-select>
  @if (pista()) {
    <mat-hint>{{ pista() }}</mat-hint>
  }
  @if (control().invalid && control().touched) {
    <mat-error>Seleccione una opción</mat-error>
  }
</mat-form-field>
