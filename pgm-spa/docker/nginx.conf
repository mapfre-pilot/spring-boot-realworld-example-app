server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad básicas (ARCH-FIS-COM-001)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Único destino de red de la SPA: el BFF. En local, el servicio 'bff' de docker-compose.
  location /api/ {
    proxy_pass ${BFF_URL};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /monitoring/health { return 200 'UP'; add_header Content-Type text/plain; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
