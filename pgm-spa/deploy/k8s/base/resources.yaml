# Propuesta hasta el onboarding SRE (ZeusOneteam-OnboardingAWSArqContJava).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgm-spa-config
data:
  BFF_URL: http://pgm-bff:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgm-spa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgm-spa
  template:
    metadata:
      labels:
        app: pgm-spa
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgm-spa
          image: pgm-spa:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pgm-spa-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pgm-spa
spec:
  type: ClusterIP
  selector:
    app: pgm-spa
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pgm-spa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pgm-spa
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
