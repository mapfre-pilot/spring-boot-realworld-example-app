services:
  pgm-bff:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: pgm-bff:local
    container_name: pgm-bff
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      OTEL_TRACING_ENABLED: "false"
    ports:
      - "${BFF_PORT:-8080}:8080"
