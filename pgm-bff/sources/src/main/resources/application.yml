spring:
  application:
    name: pgm-bff
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      enabled: ${CONFIG_SERVER_ENABLED:false}
      fail-fast: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /monitoring
      exposure:
        include: [health, metrics, prometheus, info]
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      export:
        enabled: ${OTEL_TRACING_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

pgm:
  idempotencia:
    ventana: ${PGM_IDEMPOTENCIA_VENTANA:PT24H}
  features:
    tarificacion-salud: ${PGM_FEATURE_TARIFICACION_SALUD:true}
    gestion-comercial: ${PGM_FEATURE_GESTION_COMERCIAL:true}
    cuadro-mando: ${PGM_FEATURE_CUADRO_MANDO:true}
    click-to-call: ${PGM_FEATURE_CLICK_TO_CALL:true}
    visualizacion-recibos: ${PGM_FEATURE_VISUALIZACION_RECIBOS:true}   # PGM_visualizacionRecibos (false en TEST)
    detalle-prestaciones: ${PGM_FEATURE_DETALLE_PRESTACIONES:true}     # PGM_CONS_VER_DETALLE_PRESTACIONES (false en TEST)
  gateway:
    # API Gateway interno (ARCH-FIS-COM-001): único punto de salida del BFF (API Canal y legacy publicados en él). Nunca ESB/SOAP/Denodo/core en directo.
    base-url: ${PGM_GATEWAY_BASE_URL:https://api-gateway.interno.mapfre.invalid}
    tenant: ${PGM_GATEWAY_TENANT:mapfre-es}
    connect-timeout-ms: ${PGM_GATEWAY_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${PGM_GATEWAY_READ_TIMEOUT_MS:5000}
    company-id: ${PGM_GATEWAY_COMPANY_ID:1}
    rutas:
      # API Canal (specs PROD-APICANAL-*): rutas relativas al host de cada micro, publicadas en el Gateway
      api-canal-clientes: /api-canal/clientes          # api-product-clients (PROD-APICANAL-CLIENTES-001)
      api-canal-polizas: /api-canal/polizas            # msapi-policy (PROD-APICANAL-POLIZAS-001)
      api-canal-recibos: /api-canal/recibos            # msapi-receipts (PROD-APICANAL-RECIBOS-001)
      api-canal-siniestros: /api-canal/siniestros      # msapi-accident-* (PROD-APICANAL-SINIESTROS-001)
      api-canal-ventas: /api-canal/ventas              # msapi-commercialization-health (PROD-APICANAL-VENTAS-001)
      # Legacy que ya usa PGM en Appian (decisión owner 2026-10-20), expuesto por el Gateway (ARCH-FIS-COM-001)
      pgo: /legacy/pgo                                 # PGM_MapfreDigitalHealth /apipgo/*
      sgc30: /legacy/sgc30                             # PGM_SGC3.0 /sgc3-bk-*
      imediador: /legacy/imediador                     # PGM iMediador EDGE /api/1.0/*
      bdec: /legacy/bdec                               # PGM BDEC API (ESTRUAGE)
      clients-edge: /legacy/clients-edge               # PGM Clients EDGE (negocioclientes, GESYC, METS, consentimientos, TeCuidamos)
      sgo: /legacy/sgo                                 # PGM_ServiciosSGO_* (fachada REST del Gateway sobre webMethods)
      click2call: /legacy/click2call                   # PGM_ConectaOrange Click2Call
      aci: /legacy/aci                                 # PGM crearClienteACI (alta en Área de Cliente)
      firma: /legacy/firma                             # CMP_PM_FIRMA_RGPD_COMPLETO / consentimientos
      dpve: /legacy/dpve                               # PGM_DPVE_* (Plan de pagos)
      wlcatalog: /legacy/wlcatalog                     # PGM API WLCatalog (catálogo acciones por cia+ramo, SOAP→REST)
      gesyc: /legacy/gesyc                             # GESYC consultarRecibo / imprimirRecibo (SOAP→REST)
      mets: /legacy/mets                               # METS expedientes de prestaciones
      # Legacy de PGM para las capacidades que API Canal cubriría (origen de datos = LEGACY, pestaña Configuración)
      clients-edge-recibos: /legacy/clients-edge-recibos   # Denodo receiptsDetail/products/productsDetail
      client-api: /legacy/client-api                   # apisb clients/1.0 /client/{id}/receipts
      health-api: /legacy/health-api                   # apisb health/1.0 simulación y póliza Salud
      home-api: /legacy/home-api                       # apisb home/2.0 detalle póliza Hogar
      motor-api: /legacy/motor-api                     # apisb motor/1.0 detalle póliza Autos
      life-api: /legacy/life-api                       # Life Risk API 1.0 detalle póliza Vida
      health-api-detalle: /health/1.0/individual/policy/{policyId}
      home-api-detalle: /esp/srv/api/home/2.0/policy/{numPoliza}/detail
      motor-api-detalle: /srv/api/1.0/motor/policy/{referenceNumber}/detail
      life-api-detalle: /apisbcpolizas_int-web/api/life/1.0/individual/policy/{idPoliza}
  lanzaderas:
    - { codigo: NSE, nombre: "NSE — Nuevo Sistema de Emisión", destino: NSE, ramo: AUTOS, url: "${PGM_URL_NSE:https://nse.interno.mapfre.invalid}", requiere-nuuma: false }
    - { codigo: NSE_HOGAR, nombre: "NSE — Hogar", destino: NSE, ramo: HOGAR, url: "${PGM_URL_NSE:https://nse.interno.mapfre.invalid}/hogar", requiere-nuuma: false }
    - { codigo: GESALUD, nombre: "GESALUD", destino: GESALUD, ramo: SALUD, url: "${PGM_URL_GESALUD:https://gesalud.interno.mapfre.invalid}", requiere-nuuma: false }
    - { codigo: GESVIDA, nombre: "GESVIDA / WEBVIDA", destino: GESVIDA, ramo: VIDA, url: "${PGM_URL_GESVIDA:https://gesvida.interno.mapfre.invalid}", requiere-nuuma: false }
    - { codigo: DECESOS, nombre: "Decesos — Portal Interno", destino: PORTAL_INTERNO, ramo: DECESOS, url: "${PGM_URL_PORTAL_INTERNO:https://portal.interno.mapfre.invalid}/decesos", requiere-nuuma: false }
    - { codigo: PORTAL_INTERNO, nombre: "Portal Interno", destino: PORTAL_INTERNO, url: "${PGM_URL_PORTAL_INTERNO:https://portal.interno.mapfre.invalid}", requiere-nuuma: false }
    - { codigo: SGC30, nombre: "SGC 3.0 — Gestión comercial", destino: SGC30, url: "${PGM_URL_SGC30:https://sgc.interno.mapfre.invalid}", requiere-nuuma: true }
    - { codigo: SGO, nombre: "SGO — Solicitudes", destino: SGO, url: "${PGM_URL_SGO:https://sgo.interno.mapfre.invalid}", requiere-nuuma: false }
    - { codigo: CITRIX, nombre: "Citrix — aplicaciones host", destino: CITRIX, url: "${PGM_URL_CITRIX:https://citrix.interno.mapfre.invalid}", requiere-nuuma: true }

security:
  entraid:
    tenant-id: ${ENTRAID_TENANT_ID:93ad25dd-8cdc-4066-9727-31a8a3024f80}
    audience: ${ENTRAID_AUDIENCE:c4d0e5f0-4a24-4b89-a577-bd2c809f972a}
    issuer: ${ENTRAID_ISSUER:https://login.microsoftonline.com/${ENTRAID_TENANT_ID:93ad25dd-8cdc-4066-9727-31a8a3024f80}/v2.0}
    jwk-set-uri: ${ENTRAID_JWKS_URI:https://login.microsoftonline.com/${ENTRAID_TENANT_ID:93ad25dd-8cdc-4066-9727-31a8a3024f80}/discovery/v2.0/keys}
    scope: ${ENTRAID_SCOPE:pgm.acceso}
    groups-claim: ${ENTRAID_GROUPS_CLAIM:groups}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
    instances:
      apicanal: { base-config: default }
      plataforma: { base-config: default }
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions: [ com.mapfre.pgm.bff.domain.exception.SistemaExternoException ]
        ignore-exceptions: [ com.mapfre.pgm.bff.domain.exception.ErrorClienteExternoException ]
    instances:
      apicanal-lectura: { base-config: default }
      plataforma-lectura: { base-config: default }
