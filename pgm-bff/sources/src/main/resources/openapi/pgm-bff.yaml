      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaGestionComercial' } } } }
        '403': { $ref: '#/components/responses/Prohibido' }
  /clientes/{id}/solicitudes-sgo:
    get:
      tags: [clientes]
      operationId: listarSolicitudesSgoCliente
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaSolicitudSgo' } } } }
  /polizas/{numero}:
    get:
      tags: [polizas]
      operationId: obtenerPoliza
      parameters: [ { name: numero, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Poliza' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /polizas/{numero}/recibos:
    get:
      tags: [polizas]
      operationId: listarRecibosPoliza
      parameters: [ { name: numero, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaRecibo' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /recibos/{numero}:
    get:
      tags: [recibos]
      operationId: obtenerRecibo
      parameters: [ { name: numero, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Recibo' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /tarificacion/salud:
    post:
      tags: [nueva-produccion]
      operationId: tarificarSalud
      summary: Tarificación rápida de Salud (API Canal Ventas)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TarificacionSaludRequest' } } } }
      responses:
        '200': { description: OK, headers: { Idempotent-Replayed: { schema: { type: boolean } } }, content: { application/json: { schema: { $ref: '#/components/schemas/TarificacionSaludResultado' } } } }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/ConflictoIdempotencia' }
  /tarificacion/salud/borradores:
    get:
      tags: [nueva-produccion]
      operationId: listarBorradoresTarificacion
      summary: Borradores de tarificación Salud del usuario (N. Producción › Salud › Borradores)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/BorradorResumen' } }, total: { type: integer } } } } } }
    post:
      tags: [nueva-produccion]
      operationId: guardarBorradorTarificacion
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TarificacionSaludRequest' } } } }
      responses:
        '201':
          description: Creado
          headers: { Location: { schema: { type: string } }, Idempotent-Replayed: { schema: { type: boolean } } }
          content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } }
        '409': { $ref: '#/components/responses/ConflictoIdempotencia' }
  /tarificacion/salud/borradores/{id}:
    delete:
      tags: [nueva-produccion]
      operationId: eliminarBorradorTarificacion
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '204': { description: Eliminado }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    get:
      tags: [nueva-produccion]
      operationId: obtenerBorradorTarificacion
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TarificacionSaludRequest' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /lanzaderas:
    get:
      tags: [utilidades]
      operationId: listarLanzaderas
      summary: Enlaces a NSE, GESALUD, GESVIDA, Portal Interno, SGC, SGO, Citrix (filtradas por ramo y NUUMA)
      parameters: [ { name: ramo, in: query, schema: { $ref: '#/components/schemas/Ramo' } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaLanzadera' } } } }
  /auditoria:
    post:
      tags: [utilidades]
      operationId: registrarAuditoria
      summary: Registro de acceso por NUUMA (sin PII)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuditoriaRequest' } } } }
      responses:
        '202': { description: Aceptado, headers: { Idempotent-Replayed: { schema: { type: boolean } } } }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
        '409': { $ref: '#/components/responses/ConflictoIdempotencia' }
  /comunicaciones/llamadas:
    post:
      tags: [utilidades]
      operationId: iniciarLlamada
      summary: Click-to-call (plataforma de comunicaciones)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [clienteId, telefono], properties: { clienteId: { type: string }, telefono: { type: string } } } } } }
      responses:
        '200': { description: OK, headers: { Idempotent-Replayed: { schema: { type: boolean } } }, content: { application/json: { schema: { type: object, properties: { idLlamada: { type: string } } } } } }
        '409': { $ref: '#/components/responses/PeticionInvalida' }
  /cuadro-mando/kpis:
    get:
      tags: [utilidades]
      operationId: listarKpis
      summary: Cuadro de mando de uso (requiere PGM_VISUALIZAR_CDM)
      parameters: [ { name: periodo, in: query, schema: { type: string, default: mes-actual } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaKpi' } } } }
        '403': { $ref: '#/components/responses/Prohibido' }
components:
  securitySchemes:
    entraId:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token
          scopes: { pgm.acceso: Acceso a PGM }
  parameters:
    ClienteId: { name: id, in: path, required: true, schema: { type: string }, example: C-1001 }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 255 } }
  responses:
    PeticionInvalida: { description: Petición inválida, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NoAutenticado: { description: Sin token válido }
    Prohibido: { description: Acceso no autorizado, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NoEncontrado: { description: Recurso no encontrado, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    SistemaExterno: { description: API Canal o plataforma no disponible, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    ConflictoIdempotencia: { description: Clave de idempotencia reutilizada con un cuerpo diferente, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
    Secreto: { type: object, properties: { nombre: { type: string }, descripcion: { type: string }, informado: { type: boolean }, enmascarado: { type: string, nullable: true }, origen: { type: string, nullable: true } } }
    ServicioConfigurado:
      type: object
      properties:
        clave: { type: string }
        nombre: { type: string }
        descripcion: { type: string }
        rutaGateway: { type: string }
        origen: { type: string, enum: [API_CANAL, LEGACY] }
        autenticacion: { type: string, enum: [NINGUNA, API_KEY, OAUTH_CLIENT_CREDENTIALS, BASIC, CABECERAS, COOKIE] }
        urlPorEntorno: { type: object, additionalProperties: { type: string } }
        cabeceras: { type: object, additionalProperties: { type: string } }
        credenciales: { type: array, items: { $ref: '#/components/schemas/Secreto' } }
        habilitado: { type: boolean }
    Configuracion:
      type: object
      properties:
        entorno: { type: string }
        gateway: { type: object, properties: { baseUrl: { type: string }, tenant: { type: string }, companyId: { type: string }, connectTimeoutMs: { type: integer }, readTimeoutMs: { type: integer }, rutas: { type: object, additionalProperties: { type: string } } } }
        servicios: { type: array, items: { $ref: '#/components/schemas/ServicioConfigurado' } }
        appian: { type: object, properties: { urlBase: { type: string }, sitePgm: { type: string }, siteSgo: { type: string }, usuarioServicio: { type: string }, webApis: { type: object, additionalProperties: { type: string } }, apiKey: { $ref: '#/components/schemas/Secreto' }, habilitado: { type: boolean } } }
        entraId: { type: object, properties: { habilitado: { type: boolean }, tenantId: { type: string }, clientId: { type: string }, scope: { type: string }, issuer: { type: string }, audience: { type: string }, redirectUris: { type: array, items: { type: string } }, clientSecretBff: { $ref: '#/components/schemas/Secreto' } } }
        flags: { type: object, additionalProperties: { type: boolean } }
        constantes: { type: object, additionalProperties: { type: string } }
        usuariosPrueba: { type: array, items: { type: object, properties: { usuario: { type: string }, perfiles: { type: array, items: { type: string } }, nuuma: { type: string, nullable: true }, perfilSgc30: { type: string, nullable: true }, descripcion: { type: string } } } }
        ultimaModificacion: { type: string, format: date-time, nullable: true }
        modificadoPor: { type: string, nullable: true }
    ResultadoPrueba: { type: object, properties: { servicio: { type: string }, ok: { type: boolean }, httpStatus: { type: integer, nullable: true }, latenciaMs: { type: integer }, url: { type: string }, mensaje: { type: string } } }
    AccionPoliza: { type: object, properties: { codigo: { type: string }, nombre: { type: string }, destino: { type: string }, url: { type: string, nullable: true }, requiereNuuma: { type: boolean }, externa: { type: boolean } } }
    DocumentoPoliza: { type: object, properties: { id: { type: string }, tipo: { type: string }, nombre: { type: string }, fecha: { type: string, format: date }, formato: { type: string } } }
    Garantia: { type: object, properties: { codigo: { type: string }, nombre: { type: string }, capital: { type: number, nullable: true }, franquicia: { type: string, nullable: true } } }
    Beneficiario: { type: object, properties: { nombre: { type: string }, documento: { type: string }, parentesco: { type: string }, porcentaje: { type: number } } }
    DetallePolizaRamo:
      type: object
      properties:
        numero: { type: string }
        ramo: { type: string }
        bloques: { type: object, additionalProperties: { type: object, additionalProperties: { type: string } } }
        garantias: { type: array, items: { $ref: '#/components/schemas/Garantia' } }
        beneficiarios: { type: array, items: { $ref: '#/components/schemas/Beneficiario' } }
    EstadoAnterior: { type: object, properties: { polizaNumero: { type: string }, ramo: { type: string }, producto: { type: string }, estado: { type: string }, fechaEfecto: { type: string, format: date }, fechaBaja: { type: string, format: date }, motivoBaja: { type: string } } }
    ReciboDetalle:
      type: object
      properties:
        recibo: { $ref: '#/components/schemas/Recibo' }
        producto: { type: string }
        riesgo: { type: string }
        metodoPagoLiteral: { type: string }
        pagador: { type: string }
        estructuraComercial: { type: string }
        cuota: { type: number }
        comisiones: { type: number }
        gestiones: { type: array, items: { type: string } }
    AccionRecibo: { type: object, properties: { codigo: { type: string }, nombre: { type: string }, tipo: { type: string, enum: [EXTERNA, OPERACION, INTERNA] }, url: { type: string, nullable: true } } }
    DuplicadoRecibo: { type: object, properties: { numeroRecibo: { type: string }, nombreFichero: { type: string }, tipoMime: { type: string }, contenidoBase64: { type: string } } }
    PrestacionDetalle:
      type: object
      properties:
        prestacion: { $ref: '#/components/schemas/Prestacion' }
        importeEstimado: { type: number }
        importePagado: { type: number }
        codigoRamo: { type: string }
        hitos: { type: array, items: { type: string } }
        oficinaTramitadora: { type: string }
    Alerta: { type: object, properties: { tipo: { type: string }, texto: { type: string }, fecha: { type: string, format: date } } }
    Telefono: { type: object, properties: { tipo: { type: string }, motivo: { type: string }, prefijo: { type: string }, numero: { type: string } } }
    ContactoActualizado: { type: object, properties: { telefonos: { type: array, items: { $ref: '#/components/schemas/Telefono' } }, emails: { type: array, items: { type: string, format: email } } } }
    MasDatos:
      type: object
      properties:
        nacionalidad: { type: string }
        idioma: { type: string }
        fechaNacimiento: { type: string, format: date }
        edad: { type: integer }
        sexo: { type: string }
        numeroHijos: { type: integer }
        tipoPersona: { type: string }
        estadoCivil: { type: string }
        empleadoMapfre: { type: boolean }
        profesion: { type: string }
        telefonos: { type: array, items: { $ref: '#/components/schemas/Telefono' } }
        emails: { type: array, items: { type: string } }
        origenDatos: { type: object, additionalProperties: { type: string } }
        avisos: { type: array, items: { type: string } }
    Interaccion: { type: object, properties: { id: { type: string }, fecha: { type: string, format: date-time }, canal: { type: string }, motivo: { type: string }, descripcion: { type: string }, estado: { type: string } } }
    Comunicaciones:
      type: object
      properties:
        alertas: { type: array, items: { $ref: '#/components/schemas/Alerta' } }
        interacciones: { type: array, items: { $ref: '#/components/schemas/Interaccion' } }
        reclamaciones: { type: array, items: { $ref: '#/components/schemas/Interaccion' } }
        periodo: { type: string, enum: [30D, 12M, 3A] }
    DocumentoCliente: { type: object, properties: { id: { type: string }, tipoDocumento: { type: string }, codificacion: { type: string }, nombre: { type: string }, fechaAlta: { type: string, format: date }, fechaVigencia: { type: string, format: date }, nivelLopd: { type: string }, clasificacion: { type: string }, contrato: { type: string }, clausula: { type: string } } }
    MetodoFirma: { type: object, properties: { codigo: { type: string }, nombre: { type: string }, disponible: { type: boolean } } }
    FirmaRgpd: { type: object, properties: { metodos: { type: array, items: { $ref: '#/components/schemas/MetodoFirma' } }, estado: { type: string } } }
    ResultadoAccion: { type: object, properties: { estado: { type: string }, mensaje: { type: string }, referencia: { type: string } } }
    EmpresaVinculada: { type: object, required: [cif], properties: { cif: { type: string }, razonSocial: { type: string }, actividad: { type: string }, segmento: { type: string }, clasificacion: { type: string }, cargo: { type: string }, estado: { type: string } } }
    ClienteTotal: { type: object, properties: { nif: { type: string }, nombre: { type: string }, clasificacionActual: { type: string }, nuevaClasificacion: { type: string }, empresas: { type: array, items: { $ref: '#/components/schemas/EmpresaVinculada' } }, puedeFirmar: { type: boolean } } }
    PlanPagos: { type: object, properties: { susceptible: { type: boolean }, individualDisponible: { type: boolean }, familiarDisponible: { type: boolean }, mensaje: { type: string } } }
    SimulacionPlanPagos: { type: object, properties: { tipo: { type: string }, cuotaMensual: { type: number }, numeroCuotas: { type: integer }, productosIncluidos: { type: array, items: { type: string } } } }
    Problem:
      type: object
      properties: { type: { type: string, format: uri }, title: { type: string }, status: { type: integer }, detail: { type: string }, instance: { type: string } }
    Ramo: { type: string, enum: [AUTOS, HOGAR, SALUD, VIDA, DECESOS, AHORRO, EMPRESAS, OTROS] }
    Tipologia: { type: string, enum: [PARTICULAR, AUTONOMO, EMPRESA] }
    EstadoCliente: { type: string, enum: [EN_VIGOR, POTENCIAL, ANULADO] }
    ContextoUsuario:
      type: object
      properties:
        usuario: { type: string }
        nombre: { type: string }
        perfiles: { type: array, items: { type: string } }
        perfilSgc30: { type: string, nullable: true }
        estructura: { $ref: '#/components/schemas/EstructuraComercial' }
        visibilidades: { type: object, additionalProperties: { type: boolean } }
    EstructuraComercial:
      type: object
      nullable: true
      properties: { nuuma: { type: string }, oficina: { type: string }, delegacion: { type: string }, territorial: { type: string } }
    ClienteResumen:
      type: object
      properties:
        id: { type: string }
        nombre: { type: string }
        apellidos: { type: string }
        tipoDocumento: { type: string }
        documento: { type: string }
        tipologia: { $ref: '#/components/schemas/Tipologia' }
        estado: { $ref: '#/components/schemas/EstadoCliente' }
        telefono: { type: string }
        email: { type: string }
        localidad: { type: string }
        numeroPolizasEnVigor: { type: integer }
    Cliente:
      allOf:
        - $ref: '#/components/schemas/ClienteResumen'
        - type: object
          properties:
            fechaNacimiento: { type: string, format: date }
            nacionalidad: { type: string }
            vip: { type: boolean }
