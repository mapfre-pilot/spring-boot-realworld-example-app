openapi: 3.0.3
info:
  title: pgm-bff
  version: 1.2.0
  description: |
    BFF de PGM (Plataforma de Gestión MAPFRE) para la SPA pgm-spa. Contrato OpenAPI-first (BP-API-001).
    Único punto de entrada del navegador: el BFF compone API Canal (PROD-APICANAL-*) y APIs de plataforma
    (PGO, SGC 3.0, iMediador, SGO, comunicaciones) a través del API Gateway interno (ARCH-FIS-COM-001).
    Errores en formato RFC 9457 (application/problem+json). Sin PII en logs.
  contact: { name: Arquitectura MAPFRE España — Canales y Clientes }
servers:
  - url: http://localhost:8080/api/v1
    description: Local (perfil local, sin Entra ID; cabeceras X-PGM-Usuario / X-PGM-Perfiles opcionales)
  - url: https://pgm-bff.{entorno}.mapfre.invalid/api/v1
    description: Entornos (OIDC Entra ID)
    variables: { entorno: { default: dev, enum: [dev, test, pre, pro] } }
security:
  - entraId: [pgm.acceso]
tags:
  - { name: contexto, description: Contexto y visibilidades del usuario }
  - { name: clientes, description: Búsqueda y ficha 360 }
  - { name: polizas }
  - { name: recibos }
  - { name: nueva-produccion, description: Tarificación rápida Salud y borradores }
  - { name: gestion-comercial, description: Vencimientos (PGO), actividad comercial (iMediador) y gestiones (SGC 3.0) }
  - { name: utilidades, description: Lanzaderas, auditoría, comunicaciones, cuadro de mando }
paths:
  /configuracion:
    get:
      tags: [configuracion]
      operationId: obtenerConfiguracion
      summary: Pestaña «Configuración» (solo PGM_ADMINISTRADOR) — Gateway, servicios y credenciales (enmascaradas), Appian, Entra ID, flags, constantes, usuarios de prueba
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Configuracion' } } } }
        '403': { $ref: '#/components/responses/Prohibido' }
    put:
      tags: [configuracion]
      operationId: guardarConfiguracion
      summary: Guarda la configuración no secreta (validada); los secretos se envían por /configuracion/secretos
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Configuracion' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Configuracion' } } } }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
        '403': { $ref: '#/components/responses/Prohibido' }
  /configuracion/secretos/{ambito}/{nombre}:
    put:
      tags: [configuracion]
      operationId: guardarSecreto
      summary: Guarda un secreto cifrado en el almacén del BFF (ámbito = clave de servicio | appian | entraid); nunca se devuelve en claro
      parameters:
        - { name: ambito, in: path, required: true, schema: { type: string } }
        - { name: nombre, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [valor], properties: { valor: { type: string, format: password } } } } } }
      responses:
        '200': { description: Configuración con el secreto enmascarado, content: { application/json: { schema: { $ref: '#/components/schemas/Configuracion' } } } }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
        '403': { $ref: '#/components/responses/Prohibido' }
    delete:
      tags: [configuracion]
      operationId: borrarSecreto
      parameters:
        - { name: ambito, in: path, required: true, schema: { type: string } }
        - { name: nombre, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Configuracion' } } } }
  /configuracion/servicios/{clave}/prueba:
    post:
      tags: [configuracion]
      operationId: probarServicio
      summary: «Probar conexión» con el servicio a través del Gateway (en perfil local devuelve un resultado informativo)
      parameters: [ { name: clave, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ResultadoPrueba' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /configuracion/restaurar:
    post:
      tags: [configuracion]
      operationId: restaurarConfiguracion
      summary: Restaura la configuración por defecto (application.yml + catálogo de servicios de PGM)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Configuracion' } } } }
  /polizas/{numero}/ficha:
    get:
      tags: [posicion]
      operationId: fichaPoliza
      summary: Ficha de póliza con la restricción de PGM (Autos/Hogar solo con PGM_USUARIOSGRUPOTRABAJO / PGM_GR_DETALLEHOGAR)
      parameters: [ { name: numero, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Poliza' } } } }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /polizas/{numero}/acciones:
    get:
      tags: [posicion]
      operationId: accionesPoliza
      summary: Diálogo «Acciones» de póliza — catálogo dinámico por compañía+ramo (WLCatalog); las que requieren NUUMA se filtran
      parameters: [ { name: numero, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { total: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/AccionPoliza' } } } } } } }
  /polizas/{numero}/documentos:
    get:
      tags: [posicion]
      operationId: documentosPoliza
      summary: «Documentación de emisión» → CONSULTA DESCARGA DOCUMENTOS
      parameters: [ { name: numero, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { total: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/DocumentoPoliza' } } } } } } }
  /polizas/{numero}/detalle-ramo:
    get:
      tags: [posicion]
      operationId: detallePolizaRamo
      summary: Bloques específicos por ramo (Vida/Ahorro garantías y beneficiarios; Autos vehículo/conductores; Hogar vivienda)
      parameters: [ { name: numero, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DetallePolizaRamo' } } } }
        '403': { $ref: '#/components/responses/Prohibido' }
  /clientes/{id}/estados-anteriores:
    get:
      tags: [posicion]
      operationId: estadosAnterioresCliente
      summary: Posición › Estados anteriores (pólizas anuladas/suspendidas con fecha y motivo de baja)
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { total: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/EstadoAnterior' } } } } } } }
  /recibos/{numero}/acciones:
    get:
      tags: [posicion]
      operationId: accionesRecibo
      summary: Menú ⋮ del recibo (Consulta Recibos ConsuWeb, Visualizar duplicado si NUUMA, Detalle si PGM_visualizacionRecibos)
      parameters: [ { name: numero, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { total: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/AccionRecibo' } } } } } } }
  /recibos/{numero}/detalle:
    get:
      tags: [posicion]
      operationId: detalleCompletoRecibo
      summary: Detalle interno del recibo (pagador, estructura comercial, cuota, comisiones, gestiones)
      parameters: [ { name: numero, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReciboDetalle' } } } }
        '403': { $ref: '#/components/responses/Prohibido' }
  /recibos/{numero}/duplicado:
    post:
      tags: [posicion]
      operationId: duplicadoRecibo
      summary: «Visualizar duplicado» (GESYC imprimirRecibo vía Gateway; requiere NUUMA)
      parameters: [ { name: numero, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DuplicadoRecibo' } } } }
        '403': { $ref: '#/components/responses/Prohibido' }
  /prestaciones/{numero}:
    get:
      tags: [posicion]
      operationId: detallePrestacion
      summary: Detalle del expediente de prestación (METS), visible si PGM_CONS_VER_DETALLE_PRESTACIONES
      parameters: [ { name: numero, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PrestacionDetalle' } } } }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /clientes/{id}/mas-datos:
    get:
      tags: [acciones-cliente]
      operationId: masDatosCliente
      summary: «Más datos cliente» (pestañas Más datos / Datos de contacto / Origen de los datos)
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MasDatos' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /clientes/{id}/contacto:
    put:
      tags: [acciones-cliente]
      operationId: actualizarContactoCliente
      summary: Modificar teléfonos/emails del cliente (API Canal contactMethods)
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContactoActualizado' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MasDatos' } } } }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
  /clientes/{id}/comunicaciones:
    get:
      tags: [acciones-cliente]
      operationId: centroComunicaciones
      summary: Centro de comunicaciones (alertas, interacciones, reclamaciones) con periodo 30D | 12M | 3A
      parameters:
        - { $ref: '#/components/parameters/ClienteId' }
        - { name: periodo, in: query, schema: { type: string, enum: [30D, 12M, 3A], default: 30D } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Comunicaciones' } } } }
  /clientes/{id}/documentos:
    get:
      tags: [acciones-cliente]
      operationId: consultaDescargaDocumentacion
      summary: CDD «Consulta y descarga de documentación»
      parameters:
        - { $ref: '#/components/parameters/ClienteId' }
        - { name: tipo, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { total: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/DocumentoCliente' } } } } } } }
  /clientes/{id}/dni/solicitud:
    post:
      tags: [acciones-cliente]
      operationId: solicitarDigitalizacionDni
      summary: Palanca DNI → «Digitalizar DNI» (componente Captura DNI)
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { canal: { type: string, enum: [CAPTURA_WEB, TABLETA] } } } } } }
      responses:
        '202': { description: Solicitud iniciada, content: { application/json: { schema: { $ref: '#/components/schemas/ResultadoAccion' } } } }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
  /clientes/{id}/rgpd/metodos:
    get:
      tags: [acciones-cliente]
      operationId: metodosFirmaRgpd
      summary: Métodos de firma RGPD disponibles (SMS/EMAIL deshabilitados sin móvil/email)
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FirmaRgpd' } } } }
  /clientes/{id}/rgpd/firma:
    post:
      tags: [acciones-cliente]
      operationId: firmarRgpd
      summary: Palanca RGPD → «Firmar RGPD» (CMP_PM_FIRMA_RGPD_COMPLETO)
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [metodo], properties: { metodo: { type: string, enum: [BIOMETRICA, EMAIL, SMS, IMPRESION] } } } } } }
      responses:
        '202': { description: Solicitud de firma enviada, content: { application/json: { schema: { $ref: '#/components/schemas/ResultadoAccion' } } } }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
  /clientes/{id}/aci:
    post:
      tags: [acciones-cliente]
      operationId: solicitarAltaAci
      summary: Palanca ACI → «Solicitar alta en ACI» (requiere móvil o email)
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '202': { description: Alta solicitada, content: { application/json: { schema: { $ref: '#/components/schemas/ResultadoAccion' } } } }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
  /clientes/{id}/cliente-total:
    get:
      tags: [acciones-cliente]
      operationId: clienteTotal
      summary: «Alta Cliente Total» (datos y empresas vinculadas)
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ClienteTotal' } } } }
  /clientes/{id}/cliente-total/empresas:
    post:
      tags: [acciones-cliente]
      operationId: anadirEmpresaVinculada
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmpresaVinculada' } } } }
      responses:
        '201': { description: Empresa añadida, content: { application/json: { schema: { $ref: '#/components/schemas/ClienteTotal' } } } }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
  /clientes/{id}/plan-pagos:
    get:
      tags: [acciones-cliente]
      operationId: planPagos
      summary: Palanca Plan de pagos (DPVE): susceptibilidad individual/familiar
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PlanPagos' } } } }
  /clientes/{id}/plan-pagos/simulacion:
    post:
      tags: [acciones-cliente]
      operationId: simularPlanPagos
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { tipo: { type: string, enum: [INDIVIDUAL, FAMILIAR] } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SimulacionPlanPagos' } } } }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
  /clientes/{id}/inducciones:
    post:
      tags: [acciones-cliente]
      operationId: inducirCliente
      summary: ACCIONES → Inducir (requiere NUUMA; teléfono/email; cliente no Robinson)
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { canal: { type: string, enum: [WEB, APP, EMAIL, SMS] } } } } } }
      responses:
        '202': { description: Inducción enviada, content: { application/json: { schema: { $ref: '#/components/schemas/ResultadoAccion' } } } }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
  /contexto:
    get:
      tags: [contexto]
      operationId: obtenerContexto
      summary: Perfil, estructura comercial y visibilidades calculadas por el BFF
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContextoUsuario' } } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /clientes/search:
    get:
      tags: [clientes]
      operationId: buscarClientes
      summary: Búsqueda multicriterio de clientes (federada en API Canal Clientes)
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Texto libre (nombre, documento, id) }
        - { name: documento, in: query, schema: { type: string } }
        - { name: telefono, in: query, schema: { type: string } }
        - { name: email, in: query, schema: { type: string } }
        - { name: poliza, in: query, schema: { type: string } }
        - { name: tarjetaSanitaria, in: query, schema: { type: string } }
        - { name: localidad, in: query, schema: { type: string } }
        - { name: limite, in: query, schema: { type: integer, default: 100, maximum: 50 } }
        - { name: primerApellido, in: query, schema: { type: string }, description: 'Primer Apellido' }
        - { name: segundoApellido, in: query, schema: { type: string }, description: 'Segundo apellido' }
        - { name: codigoPostal, in: query, schema: { type: string }, description: 'Código Postal' }
        - { name: expediente, in: query, schema: { type: string }, description: 'Nº Expediente' }
        - { name: matricula, in: query, schema: { type: string }, description: 'Matrícula' }
        - { name: presupuesto, in: query, schema: { type: string }, description: 'Nº presupuesto' }
        - { name: recibo, in: query, schema: { type: string }, description: 'Nº recibo' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaClienteResumen' } } } }
        '422': { description: 'Hay demasiados resultados para los criterios introducidos (>100)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '502': { $ref: '#/components/responses/SistemaExterno' }
  /clientes/{id}/ficha:
    get:
      tags: [clientes]
      operationId: obtenerFichaCliente
      summary: Visión 360 nivel 1 (cabecera, palancas, alertas, familia, posición bancaria)
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cliente' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '502': { $ref: '#/components/responses/SistemaExterno' }
  /clientes/{id}/productos:
    get:
      tags: [clientes]
      operationId: listarProductosCliente
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaPoliza' } } } }
  /clientes/{id}/recibos:
    get:
      tags: [clientes]
      operationId: listarRecibosCliente
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaRecibo' } } } }
  /clientes/{id}/prestaciones:
    get:
      tags: [clientes]
      operationId: listarPrestacionesCliente
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaPrestacion' } } } }
  /clientes/{id}/presupuestos:
    get:
      tags: [clientes]
      operationId: listarPresupuestosCliente
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaPresupuesto' } } } }
  /clientes/{id}/oportunidades:
    get:
      tags: [gestion-comercial]
      operationId: listarOportunidadesCliente
      summary: Vencimientos y oportunidades (PGO) con los filtros de PGM (Producto, Tipo Acción, Fecha Desde/Hasta, Contratado, Clase)
      parameters:
        - { $ref: '#/components/parameters/ClienteId' }
        - { name: producto, in: query, schema: { $ref: '#/components/schemas/Ramo' } }
        - { name: tipo, in: query, schema: { type: string, enum: [VENCIMIENTO, OPORTUNIDAD, CROSSELLING] } }
        - { name: clase, in: query, schema: { type: string, enum: [COMPLETO, INCOMPLETO, PRECOTIZADO] } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: contratado, in: query, schema: { type: boolean } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaOportunidad' } } } }
    post:
      tags: [gestion-comercial]
      operationId: crearOportunidadCliente
      summary: Alta de vencimiento/oportunidad incompleta (PGO POST /apipgo/opportunity/incomplete). Requiere NUUMA y perfil SGC 3.0.
      parameters: [ { $ref: '#/components/parameters/ClienteId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AltaOportunidad' } } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/Oportunidad' } } } }
        '403': { $ref: '#/components/responses/Prohibido' }
  /clientes/{id}/oportunidades/resumen:
    get:
      tags: [gestion-comercial]
      operationId: resumenOportunidadesCliente
      summary: Contadores Todos / Completo / Incompleto (PGO summary)
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ResumenOportunidades' } } } }
  /oportunidades/{id}:
    get:
      tags: [gestion-comercial]
      operationId: obtenerOportunidad
      summary: Detalle de vencimiento (datos generales, producto, riesgo, observaciones, anexos)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OportunidadDetalle' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /oportunidades/{id}/observaciones:
    post:
      tags: [gestion-comercial]
      operationId: anadirObservacionOportunidad
      parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ObservacionRequest' } } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/Observacion' } } } }
  /oportunidades/{id}/observaciones/{obsId}:
    delete:
      tags: [gestion-comercial]
      operationId: eliminarObservacionOportunidad
