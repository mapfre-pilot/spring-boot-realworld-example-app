openapi: 3.0.3
info:
  title: pgm-bff
  version: 1.2.0
  description: |
    BFF de PGM (Plataforma de Gestión MAPFRE) para la SPA pgm-spa. Contrato OpenAPI-first (BP-API-001).
    Único punto de entrada del navegador: el BFF compone API Canal (PROD-APICANAL-*) y APIs de plataforma
    (PGO, SGC 3.0, iMediador, SGO, comunicaciones) a través del API Gateway interno (ARCH-FIS-COM-001).
    Errores en formato RFC 9457 (application/problem+json). Sin PII en logs.
  contact: { name: Arquitectura MAPFRE España — Canales y Clientes }
servers:
  - url: http://localhost:8080/api/v1
    description: Local (perfil local, sin Entra ID; cabeceras X-PGM-Usuario / X-PGM-Perfiles opcionales)
  - url: https://pgm-bff.{entorno}.mapfre.invalid/api/v1
    description: Entornos (OIDC Entra ID)
    variables: { entorno: { default: dev, enum: [dev, test, pre, pro] } }
security:
  - entraId: [pgm.acceso]
tags:
  - { name: contexto, description: Contexto y visibilidades del usuario }
  - { name: clientes, description: Búsqueda y ficha 360 }
  - { name: polizas }
  - { name: recibos }
  - { name: nueva-produccion, description: Tarificación rápida Salud y borradores }
  - { name: gestion-comercial, description: Vencimientos (PGO), actividad comercial (iMediador) y gestiones (SGC 3.0) }
  - { name: utilidades, description: Lanzaderas, auditoría, comunicaciones, cuadro de mando }
paths:
  /contexto:
    get:
      tags: [contexto]
      operationId: obtenerContexto
      summary: Perfil, estructura comercial y visibilidades calculadas por el BFF
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContextoUsuario' } } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /clientes/search:
    get:
      tags: [clientes]
      operationId: buscarClientes
      summary: Búsqueda multicriterio de clientes (federada en API Canal Clientes)
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Texto libre (nombre, documento, id) }
        - { name: documento, in: query, schema: { type: string } }
        - { name: telefono, in: query, schema: { type: string } }
        - { name: email, in: query, schema: { type: string } }
        - { name: poliza, in: query, schema: { type: string } }
        - { name: tarjetaSanitaria, in: query, schema: { type: string } }
        - { name: localidad, in: query, schema: { type: string } }
        - { name: limite, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaClienteResumen' } } } }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '502': { $ref: '#/components/responses/SistemaExterno' }
  /clientes/{id}/ficha:
    get:
      tags: [clientes]
      operationId: obtenerFichaCliente
      summary: Visión 360 nivel 1 (cabecera, palancas, alertas, familia, posición bancaria)
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cliente' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '502': { $ref: '#/components/responses/SistemaExterno' }
  /clientes/{id}/productos:
    get:
      tags: [clientes]
      operationId: listarProductosCliente
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaPoliza' } } } }
  /clientes/{id}/recibos:
    get:
      tags: [clientes]
      operationId: listarRecibosCliente
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaRecibo' } } } }
  /clientes/{id}/prestaciones:
    get:
      tags: [clientes]
      operationId: listarPrestacionesCliente
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaPrestacion' } } } }
  /clientes/{id}/presupuestos:
    get:
      tags: [clientes]
      operationId: listarPresupuestosCliente
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaPresupuesto' } } } }
  /clientes/{id}/oportunidades:
    get:
      tags: [gestion-comercial]
      operationId: listarOportunidadesCliente
      summary: Vencimientos y oportunidades (PGO) con los filtros de PGM (Producto, Tipo Acción, Fecha Desde/Hasta, Contratado, Clase)
      parameters:
        - { $ref: '#/components/parameters/ClienteId' }
        - { name: producto, in: query, schema: { $ref: '#/components/schemas/Ramo' } }
        - { name: tipo, in: query, schema: { type: string, enum: [VENCIMIENTO, OPORTUNIDAD, CROSSELLING] } }
        - { name: clase, in: query, schema: { type: string, enum: [COMPLETO, INCOMPLETO, PRECOTIZADO] } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: contratado, in: query, schema: { type: boolean } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaOportunidad' } } } }
    post:
      tags: [gestion-comercial]
      operationId: crearOportunidadCliente
      summary: Alta de vencimiento/oportunidad incompleta (PGO POST /apipgo/opportunity/incomplete). Requiere NUUMA y perfil SGC 3.0.
      parameters: [ { $ref: '#/components/parameters/ClienteId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AltaOportunidad' } } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/Oportunidad' } } } }
        '403': { $ref: '#/components/responses/Prohibido' }
  /clientes/{id}/oportunidades/resumen:
    get:
      tags: [gestion-comercial]
      operationId: resumenOportunidadesCliente
      summary: Contadores Todos / Completo / Incompleto (PGO summary)
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ResumenOportunidades' } } } }
  /oportunidades/{id}:
    get:
      tags: [gestion-comercial]
      operationId: obtenerOportunidad
      summary: Detalle de vencimiento (datos generales, producto, riesgo, observaciones, anexos)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OportunidadDetalle' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /oportunidades/{id}/observaciones:
    post:
      tags: [gestion-comercial]
      operationId: anadirObservacionOportunidad
      parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ObservacionRequest' } } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/Observacion' } } } }
  /oportunidades/{id}/observaciones/{obsId}:
    delete:
      tags: [gestion-comercial]
      operationId: eliminarObservacionOportunidad
      parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { name: obsId, in: path, required: true, schema: { type: string } } ]
      responses:
        '204': { description: Eliminada }
  /clientes/{id}/actividad-comercial:
    get:
      tags: [gestion-comercial]
      operationId: listarActividadComercialCliente
      summary: Diario de actividad comercial (iMediador). Sin NUUMA responde 403 con el texto literal de PGM.
      parameters:
        - { $ref: '#/components/parameters/ClienteId' }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: gestionAlcanzada, in: query, schema: { type: string } }
        - { name: producto, in: query, schema: { type: string } }
        - { name: tipoAccion, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaActividadComercial' } } } }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [gestion-comercial]
      operationId: crearActividadComercialCliente
      summary: Nueva actividad / gestión alcanzada (iMediador insertarActividad)
      parameters: [ { $ref: '#/components/parameters/ClienteId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AltaActividad' } } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/ActividadComercial' } } } }
        '403': { $ref: '#/components/responses/Prohibido' }
  /catalogos-comerciales/{tipo}:
    get:
      tags: [gestion-comercial]
      operationId: obtenerCatalogoComercial
      summary: Catálogos iMediador/PGO (acciones, niveles de gestión, compañías de la competencia)
      parameters: [ { name: tipo, in: path, required: true, schema: { type: string, enum: [ACCIONES, NIVELES_GESTION, COMPANIAS] } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogoComercial' } } } }
  /gestiones/{id}:
    get:
      tags: [gestion-comercial]
      operationId: obtenerGestion
      summary: Detalle de gestión SGC 3.0 (potencialidad, asignación, contacto, observaciones, gestiones alcanzadas)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/GestionDetalle' } } } }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /gestiones/{id}/cierre:
    post:
      tags: [gestion-comercial]
      operationId: cerrarGestion
      summary: Cerrar gestión (Cerrada positiva / Cerrada negativa) — SGC 3.0 PUT business-tasks/close
      parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [resultado], properties: { resultado: { type: string, enum: [POSITIVA, NEGATIVA] } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/GestionComercial' } } } }
  /gestiones/{id}/reapertura:
    post:
      tags: [gestion-comercial]
      operationId: reabrirGestion
      summary: Reabrir gestión — SGC 3.0 PUT business-tasks/reopen
      parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/GestionComercial' } } } }
  /gestiones/{id}/observaciones:
    post:
      tags: [gestion-comercial]
      operationId: anadirObservacionGestion
      parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ObservacionRequest' } } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/Observacion' } } } }
  /solicitudes-sgo/{id}:
    get:
      tags: [utilidades]
      operationId: obtenerSolicitudSgo
      summary: Detalle de solicitud SGO (ConsultarSolicitud vía fachada REST del Gateway)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SolicitudSgoDetalle' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /solicitudes-sgo/{id}/documentos:
    get:
      tags: [utilidades]
      operationId: listarDocumentosSgo
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaDocumentoAdjunto' } } } }
  /clientes/{id}/gestiones:
    get:
      tags: [gestion-comercial]
      operationId: listarGestionesCliente
      summary: Gestiones comerciales SGC 3.0 / iMediador (requiere perfil SGC 3.0 y NUUMA)
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaGestionComercial' } } } }
        '403': { $ref: '#/components/responses/Prohibido' }
  /clientes/{id}/solicitudes-sgo:
    get:
      tags: [clientes]
      operationId: listarSolicitudesSgoCliente
      parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaSolicitudSgo' } } } }
  /polizas/{numero}:
    get:
      tags: [polizas]
      operationId: obtenerPoliza
      parameters: [ { name: numero, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Poliza' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /polizas/{numero}/recibos:
    get:
      tags: [polizas]
      operationId: listarRecibosPoliza
      parameters: [ { name: numero, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaRecibo' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /recibos/{numero}:
    get:
      tags: [recibos]
      operationId: obtenerRecibo
      parameters: [ { name: numero, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Recibo' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /tarificacion/salud:
    post:
      tags: [nueva-produccion]
      operationId: tarificarSalud
      summary: Tarificación rápida de Salud (API Canal Ventas)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TarificacionSaludRequest' } } } }
      responses:
        '200': { description: OK, headers: { Idempotent-Replayed: { schema: { type: boolean } } }, content: { application/json: { schema: { $ref: '#/components/schemas/TarificacionSaludResultado' } } } }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/ConflictoIdempotencia' }
  /tarificacion/salud/borradores:
    get:
      tags: [nueva-produccion]
      operationId: listarBorradoresTarificacion
      summary: Borradores de tarificación Salud del usuario (N. Producción › Salud › Borradores)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/BorradorResumen' } }, total: { type: integer } } } } } }
    post:
      tags: [nueva-produccion]
      operationId: guardarBorradorTarificacion
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TarificacionSaludRequest' } } } }
      responses:
        '201':
          description: Creado
          headers: { Location: { schema: { type: string } }, Idempotent-Replayed: { schema: { type: boolean } } }
          content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } }
        '409': { $ref: '#/components/responses/ConflictoIdempotencia' }
  /tarificacion/salud/borradores/{id}:
    delete:
      tags: [nueva-produccion]
      operationId: eliminarBorradorTarificacion
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '204': { description: Eliminado }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    get:
      tags: [nueva-produccion]
      operationId: obtenerBorradorTarificacion
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TarificacionSaludRequest' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /lanzaderas:
    get:
      tags: [utilidades]
      operationId: listarLanzaderas
      summary: Enlaces a NSE, GESALUD, GESVIDA, Portal Interno, SGC, SGO, Citrix (filtradas por ramo y NUUMA)
      parameters: [ { name: ramo, in: query, schema: { $ref: '#/components/schemas/Ramo' } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaLanzadera' } } } }
  /auditoria:
    post:
      tags: [utilidades]
      operationId: registrarAuditoria
      summary: Registro de acceso por NUUMA (sin PII)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuditoriaRequest' } } } }
      responses:
        '202': { description: Aceptado, headers: { Idempotent-Replayed: { schema: { type: boolean } } } }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
        '409': { $ref: '#/components/responses/ConflictoIdempotencia' }
  /comunicaciones/llamadas:
    post:
      tags: [utilidades]
      operationId: iniciarLlamada
      summary: Click-to-call (plataforma de comunicaciones)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [clienteId, telefono], properties: { clienteId: { type: string }, telefono: { type: string } } } } } }
      responses:
        '200': { description: OK, headers: { Idempotent-Replayed: { schema: { type: boolean } } }, content: { application/json: { schema: { type: object, properties: { idLlamada: { type: string } } } } } }
        '409': { $ref: '#/components/responses/PeticionInvalida' }
  /cuadro-mando/kpis:
    get:
      tags: [utilidades]
      operationId: listarKpis
      summary: Cuadro de mando de uso (requiere PGM_VISUALIZAR_CDM)
      parameters: [ { name: periodo, in: query, schema: { type: string, default: mes-actual } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListaKpi' } } } }
        '403': { $ref: '#/components/responses/Prohibido' }
components:
  securitySchemes:
    entraId:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token
          scopes: { pgm.acceso: Acceso a PGM }
  parameters:
    ClienteId: { name: id, in: path, required: true, schema: { type: string }, example: C-1001 }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 255 } }
  responses:
    PeticionInvalida: { description: Petición inválida, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NoAutenticado: { description: Sin token válido }
    Prohibido: { description: Acceso no autorizado, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NoEncontrado: { description: Recurso no encontrado, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    SistemaExterno: { description: API Canal o plataforma no disponible, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    ConflictoIdempotencia: { description: Clave de idempotencia reutilizada con un cuerpo diferente, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
    Problem:
      type: object
      properties: { type: { type: string, format: uri }, title: { type: string }, status: { type: integer }, detail: { type: string }, instance: { type: string } }
    Ramo: { type: string, enum: [AUTOS, HOGAR, SALUD, VIDA, DECESOS, AHORRO, EMPRESAS, OTROS] }
    Tipologia: { type: string, enum: [PARTICULAR, AUTONOMO, EMPRESA] }
    EstadoCliente: { type: string, enum: [EN_VIGOR, POTENCIAL, ANULADO] }
    ContextoUsuario:
      type: object
      properties:
        usuario: { type: string }
        nombre: { type: string }
        perfiles: { type: array, items: { type: string } }
        perfilSgc30: { type: string, nullable: true }
        estructura: { $ref: '#/components/schemas/EstructuraComercial' }
        visibilidades: { type: object, additionalProperties: { type: boolean } }
    EstructuraComercial:
      type: object
      nullable: true
      properties: { nuuma: { type: string }, oficina: { type: string }, delegacion: { type: string }, territorial: { type: string } }
    ClienteResumen:
      type: object
      properties:
        id: { type: string }
        nombre: { type: string }
        apellidos: { type: string }
        tipoDocumento: { type: string }
        documento: { type: string }
        tipologia: { $ref: '#/components/schemas/Tipologia' }
        estado: { $ref: '#/components/schemas/EstadoCliente' }
        telefono: { type: string }
        email: { type: string }
        localidad: { type: string }
        numeroPolizasEnVigor: { type: integer }
    Cliente:
      allOf:
        - $ref: '#/components/schemas/ClienteResumen'
        - type: object
          properties:
            fechaNacimiento: { type: string, format: date }
            nacionalidad: { type: string }
            vip: { type: boolean }
            robinson: { type: boolean }
            exclusivoCorredor: { type: boolean }
            direccion: { type: object, properties: { via: { type: string }, numero: { type: string }, codigoPostal: { type: string }, localidad: { type: string }, provincia: { type: string } } }
            oficinaGestora: { type: string }
            gestorAsignado: { type: string }
