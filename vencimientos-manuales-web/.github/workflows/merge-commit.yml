name: SPA - merge commit

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'vencimientos-manuales-web/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vencimientos-manuales-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: vencimientos-manuales-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx lint vencimientos-manuales-web
      - run: pnpm nx test vencimientos-manuales-web --runInBand
      - run: pnpm nx build vencimientos-manuales-web
